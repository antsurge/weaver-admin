components:
    schemas:
        CreateDepartmentRequest:
            type: object
            properties:
                parentID:
                    type: string
                    description: 父组织ID，空表示根节点
                name:
                    type: string
                    description: 组织名称
                code:
                    type: string
                    description: 组织编码
                weight:
                    type: integer
                    description: 部门权重
                    format: int32
                status:
                    type: string
                    description: 状态（enabled/disabled）
                leaderName:
                    type: string
                    description: 负责人姓名
                leaderPhone:
                    type: string
                    description: 负责人联系电话
                leaderEmail:
                    type: string
                    description: 负责人邮箱
            description: 创建组织请求
        CreateDictDataRequest:
            required:
                - dictTypeID
                - label
                - value
            type: object
            properties:
                dictTypeID:
                    type: string
                    description: 所属字典类型ID
                label:
                    type: string
                    description: 显示标签（给前端展示）
                value:
                    type: string
                    description: 字典值（实际存储值）
                weight:
                    type: integer
                    description: 排序权重，值越大越靠前
                    format: int32
                status:
                    type: string
                    description: 状态（enabled=启用，disabled=禁用）
                extension:
                    type: string
                    description: 扩展参数（JSON字符串，用于存储额外信息）
                remark:
                    type: string
                    description: 备注说明
        CreateDictTypeRequest:
            required:
                - name
                - code
                - status
            type: object
            properties:
                name:
                    type: string
                    description: 名称
                code:
                    type: string
                    description: 编码
                remark:
                    type: string
                    description: 备注
                status:
                    type: string
                    description: 状态（enabled/disabled）
        CreatePermissionRequest:
            type: object
            properties:
                name:
                    type: string
                    description: 权限名称
                code:
                    type: string
                    description: 权限唯一编码
                description:
                    type: string
                    description: 权限描述
                parentId:
                    type: string
                    description: 父权限ID，空表示根节点
                type:
                    type: string
                    description: '权限类型: menuDirectory / menuItem / button'
                path:
                    type: string
                    description: 路由路径
                icon:
                    type: string
                    description: 图标
                url:
                    type: string
                    description: URL
                component:
                    type: string
                    description: 组件路径
                weigh:
                    type: integer
                    description: 权重
                    format: int32
                status:
                    type: string
                    description: '状态: enabled / disabled'
            description: 创建权限请求
        CreatePermissionResponse:
            type: object
            properties:
                permission:
