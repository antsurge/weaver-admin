                        type: string
                    description: 关联的菜单ID列表
                dataPermissionIds:
                    type: array
                    items:
                        type: string
                    description: 关联的数据权限规则ID列表
        UpdateRoleStatusRequest:
            required:
                - status
            type: object
            properties:
                id:
                    type: string
                    description: ID
                status:
                    type: string
                    description: 状态（enabled/disabled）
        UpdateSecurityPolicyRequest:
            required:
                - ipMode
            type: object
            properties:
                loginFailEnabled:
                    type: boolean
                    description: 是否启用登录失败次数限制
                loginFailMax:
                    type: integer
                    description: 统计窗口内允许的最大失败次数（1-100）
                    format: int32
                loginFailWindowMinutes:
                    type: integer
                    description: 失败次数统计窗口（分钟，1-1440）
                    format: int32
                loginLockMinutes:
                    type: integer
                    description: 达到上限后的锁定时长（分钟，1-1440）
                    format: int32
                ipMode:
                    type: string
                    description: IP 访问控制模式（off/whitelist/blacklist）
                ipList:
                    type: array
                    items:
                        type: string
                    description: IP 列表（支持 CIDR）
                accessTokenTtlSeconds:
                    type: string
                    description: access token 有效期（秒），范围 60-2592000
                refreshTokenTtlSeconds:
                    type: string
                    description: refresh token 有效期（秒），范围 300-31536000
                remark:
                    type: string
                    description: 备注
        UpdateTenantRequest:
            required:
                - name
            type: object
            properties:
                name:
                    type: string
                    description: 租户名称
                status:
                    type: string
                    description: 状态（enabled/disabled）
                expireAt:
                    type: string
                    description: 到期时间（为空表示永不过期）
                    format: date-time
                maxUsers:
                    type: string
                    description: 最大用户数（0=不限）
                maxRoles:
                    type: string
                    description: 最大角色数（0=不限）
                contactName:
                    type: string
                    description: 联系人
                contactPhone:
                    type: string
                    description: 联系电话
                remark:
                    type: string
                    description: 备注
                id:
                    type: string
        UpdateTenantStatusRequest:
            required:
                - status
            type: object
            properties:
                id:
                    type: string
                    description: ID
                status:
                    type: string
                    description: 状态（enabled/disabled）
        UsernameExistsResponse:
            type: object
            properties:
                exists:
                    type: boolean
                    description: 是否已存在
            description: 校验用户名是否存在响应
tags:
    - name: AuthenticationService
      description: 用户后台登录认证服务
    - name: File
      description: |-
        File 文件管理服务

         说明：文件上传与访问由自定义 handler 处理（multipart 表单解析、私有桶预签名
         302 重定向），DeleteFile 走 gRPC/HTTP 生成的实现；此处统一声明 RPC 契约，
         保证 OpenAPI 文档与接口管理数据完整。
    - name: Identity
    - name: Lowcode
      description: 低代码服务
    - name: Message
      description: |-
        Message 消息通知服务

         注意：实时推送不走这里，使用自定义 SSE 端点
         GET /admin/v1/notifications/stream（EventSource 无法携带自定义 Header，
         鉴权 token 通过 query 参数 ?token= 传递）。
    - name: Ops
      description: 运维中心服务
    - name: OrderService
      description: 订单服务（HTTP 路由聚合声明，与其他模块 i_*.proto 保持一致）
    - name: Organization
    - name: PermissionService
    - name: Security
      description: Security 安全中心服务（安全策略 / 在线用户 / 操作日志 / 登录日志）
    - name: System
    - name: Tenant
