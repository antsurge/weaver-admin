syntax = "proto3";

package identity.service.v1;

import "errors/errors.proto";

// 后台用户（Admin）模块错误码
// 说明：错误码值与 biz 层 errors.BadRequest("XXX", ...) 中的 reason 字符串一一对应，
// 便于前端按 reason 做统一提示与国际化。
enum AdminErrorReason {
  option (errors.default_code) = 500;

  // 400
  BAD_REQUEST = 0 [(errors.code) = 400]; // 参数不合法
  INVALID_STATUS = 1 [(errors.code) = 400]; // 状态值非法（仅支持 enabled/disabled）
  USERNAME_ALREADY_EXISTS = 2 [(errors.code) = 400]; // 用户名已存在
  PHONE_ALREADY_EXISTS = 3 [(errors.code) = 400]; // 手机号已存在
  EMAIL_ALREADY_EXISTS = 4 [(errors.code) = 400]; // 邮箱已存在
  PASSWORD_TOO_SHORT = 5 [(errors.code) = 400]; // 密码长度不足
  CANNOT_DELETE_SELF = 6 [(errors.code) = 400]; // 不能删除当前登录账号
  CANNOT_DELETE_SUPERADMIN = 7 [(errors.code) = 400]; // 超级管理员账号不允许删除
  CANNOT_DISABLE_SUPERADMIN = 8 [(errors.code) = 400]; // 超级管理员账号不允许禁用

  // 404
  ADMIN_NOT_FOUND = 9 [(errors.code) = 404]; // 用户不存在

  // 500
  CREATE_ADMIN_FAIL = 100 [(errors.code) = 500]; // 创建用户失败
  UPDATE_ADMIN_FAIL = 101 [(errors.code) = 500]; // 更新用户失败
  DELETE_ADMIN_FAIL = 102 [(errors.code) = 500]; // 删除用户失败
}
