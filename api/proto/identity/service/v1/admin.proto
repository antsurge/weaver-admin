syntax = "proto3";

package identity.service.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/protobuf/timestamp.proto";

message Admin {
  option (gnostic.openapi.v3.schema) = {description: "后台用户信息"};
  string id = 1 [(gnostic.openapi.v3.property) = {description: "用户ID"}];
  string realName = 2 [(gnostic.openapi.v3.property) = {description: "真实姓名"}];
  string username = 3 [(gnostic.openapi.v3.property) = {description: "用户名"}];
  string email = 4 [(gnostic.openapi.v3.property) = {description: "邮箱"}];
  string phone = 5 [(gnostic.openapi.v3.property) = {description: "手机号"}];
  string avatar = 6 [(gnostic.openapi.v3.property) = {description: "头像对象键"}];
  string status = 7 [(gnostic.openapi.v3.property) = {description: "状态(enabled/disabled)"}];
  google.protobuf.Timestamp createdAt = 8 [(gnostic.openapi.v3.property) = {description: "创建时间"}];
  google.protobuf.Timestamp updatedAt = 9 [(gnostic.openapi.v3.property) = {description: "更新时间"}];

  // 头像的可访问地址（由后端根据对象键生成：公有桶为直链，私有桶为带签名的临时地址）。
  // 前端可直接用于 <img src>，无需再自行拼接访问路径。
  string avatarUrl = 10 [(gnostic.openapi.v3.property) = {description: "头像访问地址（完整可访问URL）"}];

  // 关联的角色ID列表
  repeated string roleIds = 20 [(gnostic.openapi.v3.property) = {description: "关联的角色ID列表"}];

  // 是否超级管理员（绑定超级管理员角色的用户禁止删除）
  bool isSuperAdmin = 21 [(gnostic.openapi.v3.property) = {description: "是否超级管理员"}];

  // 关联的角色名称列表（用于列表展示）
  repeated string roleNames = 22 [(gnostic.openapi.v3.property) = {description: "关联的角色名称列表"}];

  // 归属部门ID
  string departmentId = 23 [(gnostic.openapi.v3.property) = {description: "归属部门ID"}];

  // 归属部门名称（用于列表展示）
  string departmentName = 24 [(gnostic.openapi.v3.property) = {description: "归属部门名称"}];

  // 绑定的数据权限规则ID列表（空 = 跟随角色）
  repeated string dataPermissionIds = 25 [(gnostic.openapi.v3.property) = {description: "绑定的数据权限规则ID列表"}];

  // 绑定的数据权限规则名称列表（用于列表展示；空 = 跟随角色）
  repeated string dataPermissionNames = 26 [(gnostic.openapi.v3.property) = {description: "绑定的数据权限规则名称列表"}];
}

message CreateAdminRequest {
  option (gnostic.openapi.v3.schema) = {
    description: "创建后台用户请求"
    required: [
      "username",
      "password"
    ]
  };
  string realName = 1 [(gnostic.openapi.v3.property) = {description: "真实姓名"}];
  string username = 2 [(gnostic.openapi.v3.property) = {description: "用户名"}];
  string email = 3 [(gnostic.openapi.v3.property) = {description: "邮箱"}];
  string phone = 4 [(gnostic.openapi.v3.property) = {description: "手机号"}];
  string avatar = 5 [(gnostic.openapi.v3.property) = {description: "头像"}];
  string password = 6 [(gnostic.openapi.v3.property) = {description: "密码"}];
  string status = 7 [(gnostic.openapi.v3.property) = {description: "状态(enabled/disabled)"}];

  // 关联的角色ID列表（可选）
  repeated string roleIds = 20 [(gnostic.openapi.v3.property) = {description: "关联的角色ID列表"}];

  // 归属部门ID（可选）
  string departmentId = 21 [(gnostic.openapi.v3.property) = {description: "归属部门ID"}];

  // 绑定的数据权限规则ID列表（可选；空=跟随角色）
  repeated string dataPermissionIds = 22 [(gnostic.openapi.v3.property) = {description: "绑定的数据权限规则ID列表"}];
}

message UpdateAdminRequest {
  option (gnostic.openapi.v3.schema) = {
    description: "更新后台用户请求"
    required: ["id"]
  };
  string id = 1 [(gnostic.openapi.v3.property) = {description: "用户ID"}];
  string realName = 2 [(gnostic.openapi.v3.property) = {description: "真实姓名"}];
  string email = 3 [(gnostic.openapi.v3.property) = {description: "邮箱"}];
  string phone = 4 [(gnostic.openapi.v3.property) = {description: "手机号"}];
  string avatar = 5 [(gnostic.openapi.v3.property) = {description: "头像"}];
  string status = 6 [(gnostic.openapi.v3.property) = {description: "状态(enabled/disabled)"}];
  string username = 7 [(gnostic.openapi.v3.property) = {description: "用户名"}];
  // 密码（可选；空表示不修改；非空表示更新密码）
  string password = 8 [(gnostic.openapi.v3.property) = {description: "密码（可选）"}];

  // 关联的角色ID列表（可选，全量替换）
  repeated string roleIds = 20 [(gnostic.openapi.v3.property) = {description: "关联的角色ID列表"}];

  // 归属部门ID（可选）
  string departmentId = 21 [(gnostic.openapi.v3.property) = {description: "归属部门ID"}];

  // 绑定的数据权限规则ID列表（可选，全量替换；nil 表示不修改）
  repeated string dataPermissionIds = 22 [(gnostic.openapi.v3.property) = {description: "绑定的数据权限规则ID列表"}];
}

message GetAdminRequest {
  option (gnostic.openapi.v3.schema) = {
    description: "获取后台用户详情请求"
    required: ["id"]
  };
  string id = 1 [(gnostic.openapi.v3.property) = {description: "用户ID"}];
}

message ListAdminRequest {
  option (gnostic.openapi.v3.schema) = {description: "后台用户分页查询"};
  int32 page = 1 [(gnostic.openapi.v3.property) = {description: "页码"}];
  int32 pageSize = 2 [(gnostic.openapi.v3.property) = {description: "每页数量"}];
  string username = 3 [(gnostic.openapi.v3.property) = {description: "用户名（模糊匹配）"}];
  string phone = 4 [(gnostic.openapi.v3.property) = {description: "手机号（模糊匹配）"}];
  string status = 5 [(gnostic.openapi.v3.property) = {description: "状态"}];
  string realName = 6 [(gnostic.openapi.v3.property) = {description: "真实姓名（模糊匹配）"}];
  string email = 7 [(gnostic.openapi.v3.property) = {description: "邮箱（模糊匹配）"}];
  string departmentId = 8 [(gnostic.openapi.v3.property) = {description: "归属部门ID（精确匹配）"}];
}

message UpdateAdminStatusRequest {
  option (gnostic.openapi.v3.schema) = {
    description: "更新后台用户状态请求"
    required: [
      "id",
      "status"
    ]
  };
  string id = 1 [(gnostic.openapi.v3.property) = {description: "用户ID"}];
  string status = 2 [(gnostic.openapi.v3.property) = {description: "状态(enabled/disabled)"}];
}

message BatchUpdateAdminStatusRequest {
  option (gnostic.openapi.v3.schema) = {
    description: "批量更新后台用户状态请求"
    required: [
      "ids",
      "status"
    ]
  };
  repeated string ids = 1 [(gnostic.openapi.v3.property) = {description: "用户ID列表"}];
  string status = 2 [(gnostic.openapi.v3.property) = {description: "状态(enabled/disabled)"}];
}

message ListAdminResponse {
  option (gnostic.openapi.v3.schema) = {description: "后台用户分页结果"};
  int64 total = 1 [(gnostic.openapi.v3.property) = {description: "总数"}];
  repeated Admin items = 2 [(gnostic.openapi.v3.property) = {description: "列表"}];
}

message ResetPasswordRequest {
  option (gnostic.openapi.v3.schema) = {
    description: "重置密码请求"
    required: [
      "id",
      "password"
    ]
  };
  string id = 1 [(gnostic.openapi.v3.property) = {description: "用户ID"}];
  string password = 2 [(gnostic.openapi.v3.property) = {description: "新密码"}];
}

message DeleteAdminRequest {
  repeated string ids = 1 [
    (buf.validate.field).repeated = {
      min_items: 1
      max_items: 100
    },
    (buf.validate.field).cel = {
      id: "admin.ids.not_empty"
      message: "admin.ids.not_empty"
      expression: "this.all(x, x.size() > 0)"
    },
    (gnostic.openapi.v3.property) = {description: "ID列表（必填，至少1个，最多100个，每个ID不能为空）"}
  ];
}

message UsernameExistsRequest {
  option (gnostic.openapi.v3.schema) = {description: "校验用户名是否存在请求"};
  // 用户名
  string username = 1 [(gnostic.openapi.v3.property) = {description: "用户名"}];
  // 用户ID（编辑时排除自身，可为空）
  string id = 2 [(gnostic.openapi.v3.property) = {description: "用户ID（编辑时排除自身）"}];
}

message UsernameExistsResponse {
  option (gnostic.openapi.v3.schema) = {description: "校验用户名是否存在响应"};
  // 是否已存在
  bool exists = 1 [(gnostic.openapi.v3.property) = {description: "是否已存在"}];
}
