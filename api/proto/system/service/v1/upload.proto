syntax = "proto3";

package system.service.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";

option go_package = "weaver-admin/api/system/service/v1;v1";

// 上传文件响应
message UploadFileResponse {
  // 对象存储中的对象键
  string objectKey = 1 [(gnostic.openapi.v3.property) = {description: "对象存储中的对象键"}];
  // 文件访问地址
  string url = 2 [(gnostic.openapi.v3.property) = {description: "文件访问地址"}];
  // 原始文件名
  string fileName = 3 [(gnostic.openapi.v3.property) = {description: "原始文件名"}];
  // 文件大小（字节）
  int64 size = 4 [(gnostic.openapi.v3.property) = {description: "文件大小（字节）"}];
}

// 删除文件请求
message DeleteFileRequest {
  // 对象键
  string objectKey = 1 [
    (buf.validate.field).cel = {
      id: "file.objectKey.required"
      message: "file.objectKey.required"
      expression: "this.size() > 0"
    },
    (gnostic.openapi.v3.property) = {description: "对象键"}
  ];
}
