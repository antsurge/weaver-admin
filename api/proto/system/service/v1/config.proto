syntax = "proto3";

package system.service.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/protobuf/timestamp.proto";

// 系统参数配置
message Config {
  // ID
  string id = 1 [(gnostic.openapi.v3.property) = {description: "ID"}];
  // 参数名称
  string name = 2 [(gnostic.openapi.v3.property) = {description: "参数名称"}];
  // 参数键名
  string key = 3 [(gnostic.openapi.v3.property) = {description: "参数键名（唯一）"}];
  // 参数键值
  string value = 4 [(gnostic.openapi.v3.property) = {description: "参数键值"}];
  // 系统内置（Y=内置，N=外置）
  string configType = 5 [(gnostic.openapi.v3.property) = {description: "系统内置（Y=内置，N=外置）"}];
  // 状态
  string status = 6 [(gnostic.openapi.v3.property) = {description: "状态：enabled=启用，disabled=禁用"}];
  // 备注
  string remark = 7 [(gnostic.openapi.v3.property) = {description: "备注信息"}];
  // 分组名称
  string group = 11 [(gnostic.openapi.v3.property) = {description: "分组名称（可为空，即单一参数）"}];
  // 创建时间
  google.protobuf.Timestamp createdAt = 8 [(gnostic.openapi.v3.property) = {description: "创建时间"}];
  // 更新时间
  google.protobuf.Timestamp updatedAt = 9 [(gnostic.openapi.v3.property) = {description: "更新时间"}];
  // 删除时间
  google.protobuf.Timestamp deletedAt = 10 [(gnostic.openapi.v3.property) = {description: "删除时间（软删除标记）"}];
}

message ListConfigRequest {
  int64 currentPage = 1 [(gnostic.openapi.v3.property) = {description: "当前页码（从1开始）"}];
  int64 pageSize = 2 [(gnostic.openapi.v3.property) = {description: "每页条数（传0为全部）"}];
  string name = 3 [(gnostic.openapi.v3.property) = {description: "参数名称（支持模糊查询）"}];
  string key = 4 [(gnostic.openapi.v3.property) = {description: "参数键名（支持模糊查询）"}];
  string status = 5 [(gnostic.openapi.v3.property) = {description: "状态（enabled=启用，disabled=禁用）"}];
  string group = 6 [(gnostic.openapi.v3.property) = {description: "分组名称（精确匹配）"}];
}

message ListConfigResponse {
  repeated Config items = 1;
  int64 total = 2;
}

message CreateConfigRequest {
  option (gnostic.openapi.v3.schema) = {
    required: [
      "name",
      "key",
      "value",
      "configType"
    ]
  };

  // 参数名称
  string name = 1 [
    (buf.validate.field).cel = {
      id: "config.name.required"
      message: "config.name.required"
      expression: "this.size() > 0"
    },
    (buf.validate.field).cel = {
      id: "config.name.max_len"
      message: "config.name.max_len"
      expression: "this.size() <= 64"
    },
    (gnostic.openapi.v3.property) = {description: "参数名称"}
  ];
  // 参数键名
  string key = 2 [
    (buf.validate.field).cel = {
      id: "config.key.required"
      message: "config.key.required"
      expression: "this.size() > 0"
    },
    (buf.validate.field).cel = {
      id: "config.key.max_len"
      message: "config.key.max_len"
      expression: "this.size() <= 100"
    },
    (gnostic.openapi.v3.property) = {description: "参数键名"}
  ];
  // 参数键值
  string value = 3 [
    (buf.validate.field).cel = {
      id: "config.value.max_len"
      message: "config.value.max_len"
      expression: "this.size() <= 512"
    },
    (gnostic.openapi.v3.property) = {description: "参数键值"}
  ];
  // 系统内置
  string configType = 4 [
    (buf.validate.field).string = {
      in: [
        "Y",
        "N"
      ]
    },
    (buf.validate.field).cel = {
      id: "config.configType.invalid"
      message: "config.configType.invalid"
      expression: "this in ['Y', 'N']"
    },
    (gnostic.openapi.v3.property) = {description: "系统内置（Y=内置，N=外置）"}
  ];
  // 状态
  string status = 5 [
    (buf.validate.field).string = {
      in: [
        "enabled",
        "disabled"
      ]
    },
    (buf.validate.field).cel = {
      id: "config.status.invalid"
      message: "config.status.invalid"
      expression: "this in ['enabled', 'disabled']"
    },
    (gnostic.openapi.v3.property) = {description: "状态（enabled/disabled）"}
  ];
  // 备注
  string remark = 6 [
    (buf.validate.field).cel = {
      id: "config.remark.max_len"
      message: "config.remark.max_len"
      expression: "this.size() <= 255"
    },
    (gnostic.openapi.v3.property) = {description: "备注"}
  ];
  // 分组名称
  string group = 7 [
    (buf.validate.field).cel = {
      id: "config.group.max_len"
      message: "config.group.max_len"
      expression: "this.size() <= 50"
    },
    (gnostic.openapi.v3.property) = {description: "分组名称（可为空，即单一参数）"}
  ];
}

message UpdateConfigRequest {
  option (gnostic.openapi.v3.schema) = {
    required: [
      "name",
      "key",
      "value",
      "configType"
    ]
  };

  // 参数名称
  string name = 1 [
    (buf.validate.field).cel = {
      id: "config.name.required"
      message: "config.name.required"
      expression: "this.size() > 0"
    },
    (buf.validate.field).cel = {
      id: "config.name.max_len"
      message: "config.name.max_len"
      expression: "this.size() <= 64"
    },
    (gnostic.openapi.v3.property) = {description: "参数名称"}
  ];
  // 参数键名
  string key = 2 [
    (buf.validate.field).cel = {
      id: "config.key.required"
      message: "config.key.required"
      expression: "this.size() > 0"
    },
    (buf.validate.field).cel = {
      id: "config.key.max_len"
      message: "config.key.max_len"
      expression: "this.size() <= 100"
    },
    (gnostic.openapi.v3.property) = {description: "参数键名"}
  ];
  // 参数键值
  string value = 3 [
    (buf.validate.field).cel = {
      id: "config.value.max_len"
      message: "config.value.max_len"
      expression: "this.size() <= 512"
    },
    (gnostic.openapi.v3.property) = {description: "参数键值"}
  ];
  // 系统内置
  string configType = 4 [
    (buf.validate.field).string = {
      in: [
        "Y",
        "N"
      ]
    },
    (buf.validate.field).cel = {
      id: "config.configType.invalid"
      message: "config.configType.invalid"
      expression: "this in ['Y', 'N']"
    },
    (gnostic.openapi.v3.property) = {description: "系统内置（Y=内置，N=外置）"}
  ];
  // 状态
  string status = 5 [
    (buf.validate.field).string = {
      in: [
        "enabled",
        "disabled"
      ]
    },
    (buf.validate.field).cel = {
      id: "config.status.invalid"
      message: "config.status.invalid"
      expression: "this in ['enabled', 'disabled']"
    },
    (gnostic.openapi.v3.property) = {description: "状态（enabled/disabled）"}
  ];
  // 备注
  string remark = 6 [
    (buf.validate.field).cel = {
      id: "config.remark.max_len"
      message: "config.remark.max_len"
      expression: "this.size() <= 255"
    },
    (gnostic.openapi.v3.property) = {description: "备注"}
  ];
  // 分组名称
  string group = 7 [
    (buf.validate.field).cel = {
      id: "config.group.max_len"
      message: "config.group.max_len"
      expression: "this.size() <= 50"
    },
    (gnostic.openapi.v3.property) = {description: "分组名称（可为空，即单一参数）"}
  ];
  string id = 10;
}

message UpdateConfigStatusRequest {
  option (gnostic.openapi.v3.schema) = {
    required: ["status"]
  };
  // ID
  string id = 1 [(gnostic.openapi.v3.property) = {description: "ID"}];
  // 状态
  string status = 2 [
    (buf.validate.field).string = {
      in: [
        "enabled",
        "disabled"
      ]
    },
    (buf.validate.field).cel = {
      id: "config.status.invalid"
      message: "config.status.invalid"
      expression: "this in ['enabled', 'disabled']"
    },
    (gnostic.openapi.v3.property) = {description: "状态（enabled/disabled）"}
  ];
}

message DeleteConfigRequest {
  repeated string ids = 1 [
    (buf.validate.field).repeated = {
      min_items: 1
      max_items: 100
    },
    (buf.validate.field).cel = {
      id: "config.ids.not_empty"
      message: "config.ids.not_empty"
      expression: "this.all(x, x.size() > 0)"
    },
    (gnostic.openapi.v3.property) = {description: "参数ID列表，至少一个"}
  ];
}

message GetConfigByKeyRequest {
  // 参数键名
  string key = 1 [(gnostic.openapi.v3.property) = {description: "参数键名"}];
}
