syntax = "proto3";

package system.service.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "weaver-admin/api/system/service/v1;v1";

// ApiInterface 从 openapi.yaml 导入的接口信息
message ApiInterface {
  // ID
  string id = 1 [(gnostic.openapi.v3.property) = {description: "ID"}];
  // 服务名
  string service = 2 [(gnostic.openapi.v3.property) = {description: "服务全限定名，如 admin.service.v1.PermissionService"}];
  // 标签
  string tag = 3 [(gnostic.openapi.v3.property) = {description: "OpenAPI 标签，如 Permission"}];
  // HTTP 方法
  string method = 4 [(gnostic.openapi.v3.property) = {description: "HTTP method: GET/POST/PUT/DELETE"}];
  // 接口路径
  string path = 5 [(gnostic.openapi.v3.property) = {description: "接口路径，如 /admin/v1/menu"}];
  // 接口描述
  string summary = 6 [(gnostic.openapi.v3.property) = {description: "接口描述"}];
  // 唯一键
  string code = 7 [(gnostic.openapi.v3.property) = {description: "业务唯一键 service|method|path"}];
  // 创建时间
  google.protobuf.Timestamp createdAt = 8 [(gnostic.openapi.v3.property) = {description: "创建时间"}];
  // 更新时间
  google.protobuf.Timestamp updatedAt = 9 [(gnostic.openapi.v3.property) = {description: "更新时间"}];
}

// 分页列表请求
message ListApiInterfaceRequest {
  int64 currentPage = 1 [(gnostic.openapi.v3.property) = {description: "当前页码（从1开始）"}];
  int64 pageSize = 2 [(gnostic.openapi.v3.property) = {description: "每页条数（传0为全部）"}];
  string service = 3 [(gnostic.openapi.v3.property) = {description: "服务名（支持模糊查询）"}];
  string tag = 4 [(gnostic.openapi.v3.property) = {description: "标签（支持模糊查询）"}];
  string method = 5 [(gnostic.openapi.v3.property) = {description: "HTTP 方法（支持模糊查询）"}];
  string path = 6 [(gnostic.openapi.v3.property) = {description: "接口路径（支持模糊查询）"}];
  string summary = 7 [(gnostic.openapi.v3.property) = {description: "接口描述（支持模糊查询）"}];
}

// 分页列表响应
message ListApiInterfaceResponse {
  repeated ApiInterface items = 1;
  int64 total = 2;
}

// 导入请求
message ImportApiInterfaceRequest {
  // openapi.yaml 文件内容（base64 编码或直接二进制内容）
  bytes file = 1 [
    (buf.validate.field).cel = {
      id: "apiInterface.file.required"
      message: "apiInterface.file.required"
      expression: "this.size() > 0"
    },
    (buf.validate.field).cel = {
      id: "apiInterface.file.max_size"
      message: "apiInterface.file.max_size"
      expression: "this.size() <= 1048576"
    },
    (gnostic.openapi.v3.property) = {description: "openapi.yaml 文件内容"}
  ];
}

// 导入响应
message ImportApiInterfaceResponse {
  int64 total = 1 [(gnostic.openapi.v3.property) = {description: "文件中的接口总数"}];
  int64 imported = 2 [(gnostic.openapi.v3.property) = {description: "成功导入的接口数"}];
  int64 skipped = 3 [(gnostic.openapi.v3.property) = {description: "跳过的重复接口数"}];
}

// 删除请求
message DeleteApiInterfaceRequest {
  repeated string ids = 1 [
    (buf.validate.field).repeated = {
      min_items: 1
      max_items: 100
    },
    (buf.validate.field).cel = {
      id: "apiInterface.ids.not_empty"
      message: "apiInterface.ids.not_empty"
      expression: "this.all(x, x.size() > 0)"
    },
    (gnostic.openapi.v3.property) = {description: "ID列表，至少一个"}
  ];
}