syntax = "proto3";

package tenant.service.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/protobuf/timestamp.proto";

// 租户
message Tenant {
  // ID
  string id = 1 [(gnostic.openapi.v3.property) = {description: "ID"}];
  // 租户编码（登录用，创建后不可修改）
  string code = 2 [(gnostic.openapi.v3.property) = {description: "租户编码（登录用，创建后不可修改）"}];
  // 租户名称
  string name = 3 [(gnostic.openapi.v3.property) = {description: "租户名称"}];
  // 状态
  string status = 4 [(gnostic.openapi.v3.property) = {description: "状态：enabled=启用，disabled=禁用"}];
  // 到期时间
  google.protobuf.Timestamp expireAt = 5 [(gnostic.openapi.v3.property) = {description: "到期时间（为空表示永不过期）"}];
  // 最大用户数
  int64 maxUsers = 6 [(gnostic.openapi.v3.property) = {description: "最大用户数（0=不限）"}];
  // 最大角色数
  int64 maxRoles = 7 [(gnostic.openapi.v3.property) = {description: "最大角色数（0=不限）"}];
  // 联系人
  string contactName = 8 [(gnostic.openapi.v3.property) = {description: "联系人"}];
  // 联系电话
  string contactPhone = 9 [(gnostic.openapi.v3.property) = {description: "联系电话"}];
  // 备注
  string remark = 10 [(gnostic.openapi.v3.property) = {description: "备注信息"}];
  // 创建时间
  google.protobuf.Timestamp createdAt = 11 [(gnostic.openapi.v3.property) = {description: "创建时间"}];
  // 更新时间
  google.protobuf.Timestamp updatedAt = 12 [(gnostic.openapi.v3.property) = {description: "更新时间"}];
  // 删除时间
  google.protobuf.Timestamp deletedAt = 13 [(gnostic.openapi.v3.property) = {description: "删除时间（软删除标记）"}];
}

message ListTenantRequest {
  int64 currentPage = 1 [(gnostic.openapi.v3.property) = {description: "当前页码（从1开始）"}];
  int64 pageSize = 2 [(gnostic.openapi.v3.property) = {description: "每页条数（传0为全部）"}];
  string name = 3 [(gnostic.openapi.v3.property) = {description: "名称（支持模糊查询）"}];
  string code = 4 [(gnostic.openapi.v3.property) = {description: "编码（支持模糊查询）"}];
  string status = 5 [(gnostic.openapi.v3.property) = {description: "状态（enabled=启用，disabled=禁用）"}];
}

message ListTenantResponse {
  repeated Tenant items = 1;
  int64 total = 2;
}

message GetTenantRequest {
  // ID
  string id = 1 [(gnostic.openapi.v3.property) = {description: "ID"}];
}

message CreateTenantRequest {
  option (gnostic.openapi.v3.schema) = {
    required: [
      "code",
      "name"
    ]
  };

  // 租户编码
  string code = 1 [
    (buf.validate.field).cel = {
      id: "tenant.code.required"
      message: "tenant.code.required"
      expression: "this.size() > 0"
    },
    (buf.validate.field).cel = {
      id: "tenant.code.max_len"
      message: "tenant.code.max_len"
      expression: "this.size() <= 64"
    },
    (buf.validate.field).cel = {
      id: "tenant.code.pattern"
      message: "tenant.code.pattern"
      expression: "this.matches('^[a-zA-Z0-9_-]{1,64}$')"
    },
    (gnostic.openapi.v3.property) = {description: "租户编码（字母/数字/下划线/中划线）"}
  ];
  // 租户名称
  string name = 2 [
    (buf.validate.field).cel = {
      id: "tenant.name.required"
      message: "tenant.name.required"
      expression: "this.size() > 0"
    },
    (buf.validate.field).cel = {
      id: "tenant.name.max_len"
      message: "tenant.name.max_len"
      expression: "this.size() <= 64"
    },
    (gnostic.openapi.v3.property) = {description: "租户名称"}
  ];
  // 状态
  string status = 3 [
    (buf.validate.field).string = {
      in: [
        "enabled",
        "disabled"
      ]
    },
    (buf.validate.field).cel = {
      id: "tenant.status.invalid"
      message: "tenant.status.invalid"
      expression: "this in ['enabled', 'disabled']"
    },
    (gnostic.openapi.v3.property) = {description: "状态（enabled/disabled）"}
  ];
  // 到期时间
  google.protobuf.Timestamp expireAt = 4 [(gnostic.openapi.v3.property) = {description: "到期时间（为空表示永不过期）"}];
  // 最大用户数
  int64 maxUsers = 5 [(gnostic.openapi.v3.property) = {description: "最大用户数（0=不限）"}];
  // 最大角色数
  int64 maxRoles = 6 [(gnostic.openapi.v3.property) = {description: "最大角色数（0=不限）"}];
  // 联系人
  string contactName = 7 [
    (buf.validate.field).cel = {
      id: "tenant.contactName.max_len"
      message: "tenant.contactName.max_len"
      expression: "this.size() <= 64"
    },
    (gnostic.openapi.v3.property) = {description: "联系人"}
  ];
  // 联系电话
  string contactPhone = 8 [
    (buf.validate.field).cel = {
      id: "tenant.contactPhone.max_len"
      message: "tenant.contactPhone.max_len"
      expression: "this.size() <= 20"
    },
    (gnostic.openapi.v3.property) = {description: "联系电话"}
  ];
  // 备注
  string remark = 9 [
    (buf.validate.field).cel = {
      id: "tenant.remark.max_len"
      message: "tenant.remark.max_len"
      expression: "this.size() <= 256"
    },
    (gnostic.openapi.v3.property) = {description: "备注"}
  ];
}

message UpdateTenantRequest {
  option (gnostic.openapi.v3.schema) = {
    required: [
      "name"
    ]
  };

  // 租户名称
  string name = 1 [
    (buf.validate.field).cel = {
      id: "tenant.name.required"
      message: "tenant.name.required"
      expression: "this.size() > 0"
    },
    (buf.validate.field).cel = {
      id: "tenant.name.max_len"
      message: "tenant.name.max_len"
      expression: "this.size() <= 64"
    },
    (gnostic.openapi.v3.property) = {description: "租户名称"}
  ];
  // 状态
  string status = 2 [
    (buf.validate.field).string = {
      in: [
        "enabled",
        "disabled"
      ]
    },
    (buf.validate.field).cel = {
      id: "tenant.status.invalid"
      message: "tenant.status.invalid"
      expression: "this in ['enabled', 'disabled']"
    },
    (gnostic.openapi.v3.property) = {description: "状态（enabled/disabled）"}
  ];
  // 到期时间
  google.protobuf.Timestamp expireAt = 3 [(gnostic.openapi.v3.property) = {description: "到期时间（为空表示永不过期）"}];
  // 最大用户数
  int64 maxUsers = 4 [(gnostic.openapi.v3.property) = {description: "最大用户数（0=不限）"}];
  // 最大角色数
  int64 maxRoles = 5 [(gnostic.openapi.v3.property) = {description: "最大角色数（0=不限）"}];
  // 联系人
  string contactName = 6 [
    (buf.validate.field).cel = {
      id: "tenant.contactName.max_len"
      message: "tenant.contactName.max_len"
      expression: "this.size() <= 64"
    },
    (gnostic.openapi.v3.property) = {description: "联系人"}
  ];
  // 联系电话
  string contactPhone = 7 [
    (buf.validate.field).cel = {
      id: "tenant.contactPhone.max_len"
      message: "tenant.contactPhone.max_len"
      expression: "this.size() <= 20"
    },
    (gnostic.openapi.v3.property) = {description: "联系电话"}
  ];
  // 备注
  string remark = 8 [
    (buf.validate.field).cel = {
      id: "tenant.remark.max_len"
      message: "tenant.remark.max_len"
      expression: "this.size() <= 256"
    },
    (gnostic.openapi.v3.property) = {description: "备注"}
  ];
  string id = 10;
}

message UpdateTenantStatusRequest {
  option (gnostic.openapi.v3.schema) = {
    required: ["status"]
  };
  // ID
  string id = 1 [(gnostic.openapi.v3.property) = {description: "ID"}];
  // 状态
  string status = 2 [
    (buf.validate.field).string = {
      in: [
        "enabled",
        "disabled"
      ]
    },
    (buf.validate.field).cel = {
      id: "tenant.status.invalid"
      message: "tenant.status.invalid"
      expression: "this in ['enabled', 'disabled']"
    },
    (gnostic.openapi.v3.property) = {description: "状态（enabled/disabled）"}
  ];
}

message DeleteTenantRequest {
  repeated string ids = 1 [
    (buf.validate.field).repeated = {
      min_items: 1
      max_items: 100
    },
    (buf.validate.field).cel = {
      id: "tenant.ids.not_empty"
      message: "tenant.ids.not_empty"
      expression: "this.all(x, x.size() > 0)"
    },
    (gnostic.openapi.v3.property) = {description: "租户ID列表，至少一个"}
  ];
}