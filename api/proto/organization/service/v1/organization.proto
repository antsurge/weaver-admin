syntax = "proto3";

package organization.service.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/protobuf/timestamp.proto";

message Organization {
  // 部门ID
  string id = 1;

  // 父部门ID，空表示根节点
  string parent_id = 2;

  // 部门名称
  string name = 3;

  // 部门code
  string code = 4;

  // 权重
  int32 weight = 5;

  // 状态：enabled=启用 disabled=禁用
  string status = 6;

  // 负责人姓名
  string leader_name = 7;

  // 联系电话
  string leader_phone = 8;

  // 邮箱
  string leader_email = 9;

  // 创建时间
  google.protobuf.Timestamp created_at = 10;

  // 更新时间
  google.protobuf.Timestamp updated_at = 11;

  repeated Organization children = 30;
}

// 创建组织请求
message CreateOrganizationRequest {
  string parent_id = 1 [
    (buf.validate.field).cel = {
      id: "CREATE_ORG_PARENTID_MAX"
      expression: "this.size() <= 36"
    },
    (gnostic.openapi.v3.property) = {description: "父部门ID，空表示根节点"}
  ];

  string name = 2 [
    (buf.validate.field).cel = {
      id: "CREATE_ORG_NAME_REQUIRED"
      message: "部门名称不能为空"
      expression: "this.size() > 0 && this.size() <= 64"
    },
    (gnostic.openapi.v3.property) = {description: "部门名称"}
  ];

  string code = 3 [
    (buf.validate.field).cel = {
      id: "CREATE_ORG_CODE_REQUIRED"
      message: "部门编码不能为空"
      expression: "this.size() > 0 && this.size() <= 64"
    },
    (gnostic.openapi.v3.property) = {description: "部门唯一编码"}
  ];

  int32 weight = 4 [
    (buf.validate.field).cel = {
      id: "CREATE_ORG_WEIGHT_MIN"
      expression: "this >= 0"
    },
    (gnostic.openapi.v3.property) = {description: "部门权重，越大越靠前"}
  ];

  string status = 5 [
    (buf.validate.field).cel = {
      id: "CREATE_ORG_STATUS_ALLOWED"
      expression: "this == 'enabled' || this == 'disabled'"
    },
    (gnostic.openapi.v3.property) = {description: "状态: enabled / disabled"}
  ];

  string leader_name = 6 [
    (buf.validate.field).cel = {
      id: "CREATE_ORG_LEADER_NAME_MAX"
      expression: "this.size() <= 64"
    },
    (gnostic.openapi.v3.property) = {description: "负责人姓名"}
  ];

  string leader_phone = 7 [
    (buf.validate.field).cel = {
      id: "CREATE_ORG_LEADER_PHONE_MAX"
      expression: "this.size() <= 20"
    },
    (gnostic.openapi.v3.property) = {description: "负责人联系电话"}
  ];

  string leader_email = 8 [
    (buf.validate.field).cel = {
      id: "CREATE_ORG_LEADER_EMAIL_MAX"
      expression: "this.size() <= 128"
    },
    (gnostic.openapi.v3.property) = {description: "负责人邮箱"}
  ];
}

// 编辑组织请求
message UpdateOrganizationRequest {
  string id = 1;
  string parent_id = 2 [
    (buf.validate.field).cel = {
      id: "CREATE_ORG_PARENTID_MAX"
      expression: "this.size() <= 36"
    },
    (gnostic.openapi.v3.property) = {description: "父部门ID，空表示根节点"}
  ];

  string name = 3 [
    (buf.validate.field).cel = {
      id: "CREATE_ORG_NAME_REQUIRED"
      message: "部门名称不能为空"
      expression: "this.size() > 0 && this.size() <= 64"
    },
    (gnostic.openapi.v3.property) = {description: "部门名称"}
  ];

  string code = 4 [
    (buf.validate.field).cel = {
      id: "CREATE_ORG_CODE_REQUIRED"
      message: "部门编码不能为空"
      expression: "this.size() > 0 && this.size() <= 64"
    },
    (gnostic.openapi.v3.property) = {description: "部门唯一编码"}
  ];

  int32 weight = 5 [
    (buf.validate.field).cel = {
      id: "CREATE_ORG_WEIGHT_MIN"
      expression: "this >= 0"
    },
    (gnostic.openapi.v3.property) = {description: "部门权重，越大越靠前"}
  ];

  string status = 6 [
    (buf.validate.field).cel = {
      id: "CREATE_ORG_STATUS_ALLOWED"
      expression: "this == 'enabled' || this == 'disabled'"
    },
    (gnostic.openapi.v3.property) = {description: "状态: enabled / disabled"}
  ];

  string leader_name = 7 [
    (buf.validate.field).cel = {
      id: "CREATE_ORG_LEADER_NAME_MAX"
      expression: "this.size() <= 64"
    },
    (gnostic.openapi.v3.property) = {description: "负责人姓名"}
  ];

  string leader_phone = 8 [
    (buf.validate.field).cel = {
      id: "CREATE_ORG_LEADER_PHONE_MAX"
      expression: "this.size() <= 20"
    },
    (gnostic.openapi.v3.property) = {description: "负责人联系电话"}
  ];

  string leader_email = 9 [
    (buf.validate.field).cel = {
      id: "CREATE_ORG_LEADER_EMAIL_MAX"
      expression: "this.size() <= 128"
    },
    (gnostic.openapi.v3.property) = {description: "负责人邮箱"}
  ];
}

// 组织tree请求
message OrganizationTreeRequest {}

// 树形权限列表响应
message OrganizationTreeResponse {
  repeated Organization data = 1;
}

// 删除组织
message DeleteOrganizationRequset {
  repeated string ids = 1 [
    (buf.validate.field).repeated = {min_items: 1},
    (gnostic.openapi.v3.property) = {description: "组织ID列表，至少一个"}
  ];
}

// 更新组织状态请求
message UpdateOrganizationStatusRequest {
  string id = 1 [
    (buf.validate.field).cel = {
      id: "GET_PERMISSION_ID_REQUIRED"
      message: "权限ID不能为空"
      expression: "this.size() > 0"
    },
    (gnostic.openapi.v3.property) = {description: "权限ID"}
  ];
  string status = 2 [(gnostic.openapi.v3.property) = {description: "状态: enabled / disabled"}];
}
