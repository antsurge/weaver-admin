syntax = "proto3";

package organization.service.v1;

import "buf/validate/validate.proto";
import "common/v1/sort.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/protobuf/timestamp.proto";

// 职务
message Position {
  // 职务ID
  string id = 1 [(gnostic.openapi.v3.property) = {description: "ID"}];
  // 职务名称
  string name = 2 [(gnostic.openapi.v3.property) = {description: "职务名称"}];
  // 职务code
  string code = 3 [(gnostic.openapi.v3.property) = {description: "职务编码"}];
  // 权重
  int64 weight = 4 [(gnostic.openapi.v3.property) = {description: "权重/职务级别（越小职务越高）"}];
  // 状态：enabled=启用 disabled=禁用
  string status = 5 [(gnostic.openapi.v3.property) = {description: "状态（enabled=启用，disabled=禁用）"}];
  // 备注
  string remark = 6 [(gnostic.openapi.v3.property) = {description: "备注说明"}];
  // 创建时间
  google.protobuf.Timestamp createdAt = 7 [(gnostic.openapi.v3.property) = {description: "创建时间"}];
  // 更新时间
  google.protobuf.Timestamp updatedAt = 8 [(gnostic.openapi.v3.property) = {description: "更新时间"}];
}

message ListPositionRequest {
  int64 currentPage = 1 [(gnostic.openapi.v3.property) = {description: "当前页码（从1开始）"}];
  int64 pageSize = 2 [(gnostic.openapi.v3.property) = {description: "每页条数（传0为全部）"}];
  string name = 3 [(gnostic.openapi.v3.property) = {description: "职务名称（支持模糊查询）"}];
  string code = 4 [(gnostic.openapi.v3.property) = {description: "职务编码（支持模糊查询）"}];
  string status = 5 [(gnostic.openapi.v3.property) = {description: "状态（enabled=启用，disabled=禁用）"}];

  repeated common.v1.Sort sorts = 20 [(gnostic.openapi.v3.property) = {description: "排序"}];
}

message ListPositionResponse {
  repeated Position items = 1 [(gnostic.openapi.v3.property) = {description: "列表"}];
  int64 total = 2 [(gnostic.openapi.v3.property) = {description: "总数"}];
}

message GetPositionRequest {
  string id = 1 [(gnostic.openapi.v3.property) = {description: "职务ID"}];
}

message CreatePositionRequest {
  option (gnostic.openapi.v3.schema) = {
    required: [
      "name",
      "code",
      "status"
    ]
  };

  // 职务名称
  string name = 1 [
    (buf.validate.field).cel = {
      id: "position.name.required"
      message: "position.name.required"
      expression: "this.size() > 0"
    },
    (buf.validate.field).cel = {
      id: "position.name.max_len"
      message: "position.name.max_len"
      expression: "this.size() <= 64"
    },
    (gnostic.openapi.v3.property) = {description: "职务名称"}
  ];
  // 职务编码
  string code = 2 [
    (buf.validate.field).cel = {
      id: "position.code.required"
      message: "position.code.required"
      expression: "this.size() > 0"
    },
    (buf.validate.field).cel = {
      id: "position.code.max_len"
      message: "position.code.max_len"
      expression: "this.size() <= 64"
    },
    (gnostic.openapi.v3.property) = {description: "职务编码"}
  ];
  // 权重
  int64 weight = 3 [(gnostic.openapi.v3.property) = {description: "权重"}];
  // 状态
  string status = 4 [
    (buf.validate.field).string = {
      in: [
        "enabled",
        "disabled"
      ]
    },
    (buf.validate.field).cel = {
      id: "position.status.invalid"
      message: "position.status.invalid"
      expression: "this in ['enabled', 'disabled']"
    },
    (gnostic.openapi.v3.property) = {description: "状态（enabled/disabled）"}
  ];
  // 备注
  string remark = 5 [
    (buf.validate.field).cel = {
      id: "position.remark.max_len"
      message: "position.remark.max_len"
      expression: "this.size() <= 255"
    },
    (gnostic.openapi.v3.property) = {description: "备注"}
  ];
}

message UpdatePositionRequest {
  option (gnostic.openapi.v3.schema) = {
    required: [
      "name",
      "code",
      "status"
    ]
  };

  // 职务名称
  string name = 1 [
    (buf.validate.field).cel = {
      id: "position.name.required"
      message: "position.name.required"
      expression: "this.size() > 0"
    },
    (buf.validate.field).cel = {
      id: "position.name.max_len"
      message: "position.name.max_len"
      expression: "this.size() <= 64"
    },
    (gnostic.openapi.v3.property) = {description: "职务名称"}
  ];
  // 职务编码
  string code = 2 [
    (buf.validate.field).cel = {
      id: "position.code.required"
      message: "position.code.required"
      expression: "this.size() > 0"
    },
    (buf.validate.field).cel = {
      id: "position.code.max_len"
      message: "position.code.max_len"
      expression: "this.size() <= 64"
    },
    (gnostic.openapi.v3.property) = {description: "职务编码"}
  ];
  // 权重
  int64 weight = 3 [(gnostic.openapi.v3.property) = {description: "权重"}];
  // 状态
  string status = 4 [
    (buf.validate.field).string = {
      in: [
        "enabled",
        "disabled"
      ]
    },
    (buf.validate.field).cel = {
      id: "position.status.invalid"
      message: "position.status.invalid"
      expression: "this in ['enabled', 'disabled']"
    },
    (gnostic.openapi.v3.property) = {description: "状态（enabled/disabled）"}
  ];
  // 备注
  string remark = 5 [
    (buf.validate.field).cel = {
      id: "position.remark.max_len"
      message: "position.remark.max_len"
      expression: "this.size() <= 255"
    },
    (gnostic.openapi.v3.property) = {description: "备注"}
  ];
  // 职务ID
  string id = 6;
}

message UpdatePositionStatusRequest {
  option (gnostic.openapi.v3.schema) = {
    required: ["status"]
  };
  // ID
  string id = 1 [(gnostic.openapi.v3.property) = {description: "ID"}];
  // 职务状态
  string status = 2 [
    (buf.validate.field).string = {
      in: [
        "enabled",
        "disabled"
      ]
    },
    (buf.validate.field).cel = {
      id: "position.status.invalid"
      message: "position.status.invalid"
      expression: "this in ['enabled', 'disabled']"
    },
    (gnostic.openapi.v3.property) = {description: "状态（enabled/disabled）"}
  ];
}

message DeletePositionRequest {
  repeated string ids = 1 [
    (buf.validate.field).repeated = {
      min_items: 1
      max_items: 100
    },
    (buf.validate.field).cel = {
      id: "position.ids.not_empty"
      message: "position.ids.not_empty"
      expression: "this.all(x, x.size() > 0)"
    },
    (gnostic.openapi.v3.property) = {description: "职务ID列表（必填，至少1个，最多100个，每个ID不能为空）"}
  ];
}

message IsPositionNameExistsRequest {
  string name = 1;
  string id = 2;
}

message IsPositionCodeExistsRequest {
  string code = 1;
  string id = 2;
}

message IsPositionFieldExistsResponse {
  bool exists = 1;
}
