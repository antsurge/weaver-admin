syntax = "proto3";

package organization.service.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/protobuf/timestamp.proto";

// 部门
message Department {
  // ID
  string id = 1 [(gnostic.openapi.v3.property) = {description: "ID"}];
  // 父部门ID，空表示根节点
  string parentID = 2 [(gnostic.openapi.v3.property) = {description: "父组织ID，空表示根节点"}];
  // 部门名称
  string name = 3 [(gnostic.openapi.v3.property) = {description: "组织名称"}];
  // 部门code
  string code = 4 [(gnostic.openapi.v3.property) = {description: "组织唯一编码"}];
  // 权重
  int32 weight = 5 [(gnostic.openapi.v3.property) = {description: "排序权重，值越大越靠前"}];
  // 状态：enabled=启用 disabled=禁用
  string status = 6 [(gnostic.openapi.v3.property) = {description: "状态：enabled=启用，disabled=禁用"}];
  // 负责人姓名
  string leaderName = 7 [(gnostic.openapi.v3.property) = {description: "负责人姓名"}];
  // 联系电话
  string leaderPhone = 8 [(gnostic.openapi.v3.property) = {description: "负责人联系电话"}];
  // 邮箱
  string leaderEmail = 9 [(gnostic.openapi.v3.property) = {description: "负责人邮箱"}];
  // 创建时间
  google.protobuf.Timestamp createdAt = 10 [(gnostic.openapi.v3.property) = {description: "创建时间"}];
  // 更新时间
  google.protobuf.Timestamp updatedAt = 11 [(gnostic.openapi.v3.property) = {description: "更新时间"}];
  string type = 12 [(gnostic.openapi.v3.property) = {description: "类型（company=公司 subsidiary=子公司 department=部门 position=岗位）"}];
  // 子部门
  repeated Department children = 30 [(gnostic.openapi.v3.property) = {description: "子部门列表（树结构）"}];
}

// 创建组织请求
message CreateDepartmentRequest {
  string parentID = 1 [(gnostic.openapi.v3.property) = {description: "父组织ID，空表示根节点"}];
  string name = 2 [
    (buf.validate.field).cel = {
      id: "department.name.required"
      message: "department.name.required"
      expression: "this.size() > 0"
    },
    (buf.validate.field).cel = {
      id: "department.name.max_len"
      message: "department.name.max_len"
      expression: "this.size() <= 64"
    },
    (gnostic.openapi.v3.property) = {description: "组织名称"}
  ];
  string code = 3 [
    (buf.validate.field).cel = {
      id: "department.code.required"
      message: "department.code.required"
      expression: "this.size() > 0"
    },
    (buf.validate.field).cel = {
      id: "department.code.max_len"
      message: "department.code.max_len"
      expression: "this.size() <= 64"
    },
    (gnostic.openapi.v3.property) = {description: "组织编码"}
  ];
  int32 weight = 4 [(gnostic.openapi.v3.property) = {description: "部门权重"}];
  string status = 5 [
    (buf.validate.field).string = {
      in: [
        "enabled",
        "disabled"
      ]
    },
    (buf.validate.field).cel = {
      id: "department.status.invalid"
      message: "department.status.invalid"
      expression: "this in ['enabled', 'disabled']"
    },
    (gnostic.openapi.v3.property) = {description: "状态（enabled/disabled）"}
  ];

  string leaderName = 6 [
    (buf.validate.field).cel = {
      id: "department.leaderName.max_len"
      message: "department.leaderName.max_len"
      expression: "this.size() <= 64"
    },
    (gnostic.openapi.v3.property) = {description: "负责人姓名"}
  ];
  string leaderPhone = 7 [
    (buf.validate.field).cel = {
      id: "department.leaderPhone.max_len"
      message: "department.leaderPhone.max_len"
      expression: "this.size() <= 20"
    },
    (gnostic.openapi.v3.property) = {description: "负责人联系电话"}
  ];
  string leaderEmail = 8 [
    (buf.validate.field).cel = {
      id: "department.leaderEmail.max_len"
      message: "department.leaderEmail.max_len"
      expression: "this.size() <= 20"
    },
    (gnostic.openapi.v3.property) = {description: "负责人邮箱"}
  ];
  string type = 9 [
    (buf.validate.field).string = {
      in: [
        "enabled",
        "disabled"
      ]
    },
    (buf.validate.field).cel = {
      id: "department.type.invalid"
      message: "department.type.invalid"
      expression: "this in ['company', 'subsidiary','department','position']"
    },
    (gnostic.openapi.v3.property) = {description: "类型（company=公司 subsidiary=子公司 department=部门 position=岗位）"}
  ];
}

// 编辑组织请求
message UpdateDepartmentRequest {
  string parentID = 1 [(gnostic.openapi.v3.property) = {description: "父组织ID，空表示根节点"}];
  string name = 2 [
    (buf.validate.field).cel = {
      id: "department.name.required"
      message: "department.name.required"
      expression: "this.size() > 0"
    },
    (buf.validate.field).cel = {
      id: "department.name.max_len"
      message: "department.name.max_len"
      expression: "this.size() <= 64"
    },
    (gnostic.openapi.v3.property) = {description: "组织名称"}
  ];
  string code = 3 [
    (buf.validate.field).cel = {
      id: "department.code.required"
      message: "department.code.required"
      expression: "this.size() > 0"
    },
    (buf.validate.field).cel = {
      id: "department.code.max_len"
      message: "department.code.max_len"
      expression: "this.size() <= 64"
    },
    (gnostic.openapi.v3.property) = {description: "组织编码"}
  ];
  int32 weight = 4 [(gnostic.openapi.v3.property) = {description: "部门权重"}];
  string status = 5 [
    (buf.validate.field).string = {
      in: [
        "enabled",
        "disabled"
      ]
    },
    (buf.validate.field).cel = {
      id: "department.status.invalid"
      message: "department.status.invalid"
      expression: "this in ['enabled', 'disabled']"
    },
    (gnostic.openapi.v3.property) = {description: "状态（enabled/disabled）"}
  ];

  string leaderName = 6 [
    (buf.validate.field).cel = {
      id: "department.leaderName.max_len"
      message: "department.leaderName.max_len"
      expression: "this.size() <= 64"
    },
    (gnostic.openapi.v3.property) = {description: "负责人姓名"}
  ];
  string leaderPhone = 7 [
    (buf.validate.field).cel = {
      id: "department.leaderPhone.max_len"
      message: "department.leaderPhone.max_len"
      expression: "this.size() <= 20"
    },
    (gnostic.openapi.v3.property) = {description: "负责人联系电话"}
  ];
  string leaderEmail = 8 [
    (buf.validate.field).cel = {
      id: "department.leaderEmail.max_len"
      message: "department.leaderEmail.max_len"
      expression: "this.size() <= 20"
    },
    (gnostic.openapi.v3.property) = {description: "负责人邮箱"}
  ];

  string id = 20;
}

// 组织tree请求
message DepartmentTreeRequest {
  string name = 3 [(gnostic.openapi.v3.property) = {description: "组织名称（支持模糊查询）"}];
  string code = 4 [(gnostic.openapi.v3.property) = {description: "组织编码（支持模糊查询）"}];
  string status = 5 [(gnostic.openapi.v3.property) = {description: "状态（enabled=启用，disabled=禁用）"}];
}

// 树形权限列表响应
message DepartmentTreeResponse {
  repeated Department items = 1;
}

// 删除组织
message DeleteDepartmentRequset {
  repeated string ids = 1 [
    (buf.validate.field).repeated = {
      min_items: 1
      max_items: 100
    },
    (buf.validate.field).cel = {
      id: "department.ids.not_empty"
      message: "department.ids.not_empty"
      expression: "this.all(x, x.size() > 0)"
    },
    (gnostic.openapi.v3.property) = {description: "组织ID列表，至少一个"}
  ];
}

// 更新组织状态请求
message UpdateDepartmentStatusRequest {
  option (gnostic.openapi.v3.schema) = {
    required: ["status"]
  };
  // ID
  string id = 1 [(gnostic.openapi.v3.property) = {description: "ID"}];
  // 职务状态
  string status = 2 [
    (buf.validate.field).string = {
      in: [
        "enabled",
        "disabled"
      ]
    },
    (buf.validate.field).cel = {
      id: "department.status.invalid"
      message: "department.status.invalid"
      expression: "this in ['enabled', 'disabled']"
    },
    (gnostic.openapi.v3.property) = {description: "状态（enabled/disabled）"}
  ];
}

message GetDepartmentRequest {
  string id = 1;
}
