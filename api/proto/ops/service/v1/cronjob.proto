}

message UpdateJobStatusRequest {
  option (gnostic.openapi.v3.schema) = {
    required: ["status"]
  };
  // ID
  string id = 1 [(gnostic.openapi.v3.property) = {description: "任务ID"}];
  // 状态
  string status = 2 [
    (buf.validate.field).string = {
      in: [
        "enabled",
        "disabled"
      ]
    },
    (buf.validate.field).cel = {
      id: "job.status.invalid"
      message: "job.status.invalid"
      expression: "this in ['enabled', 'disabled']"
    },
    (gnostic.openapi.v3.property) = {description: "状态（enabled/disabled）"}
  ];
}

message DeleteJobRequest {
  repeated string ids = 1 [
    (buf.validate.field).repeated = {
      min_items: 1
      max_items: 100
    },
    (buf.validate.field).cel = {
      id: "job.ids.not_empty"
      message: "job.ids.not_empty"
      expression: "this.all(x, x.size() > 0)"
    },
    (gnostic.openapi.v3.property) = {description: "任务ID列表，至少一个"}
  ];
}

// 立即执行一次
message RunJobRequest {
  option (gnostic.openapi.v3.schema) = {
    required: ["id"]
  };
  // 任务ID
  string id = 1 [(gnostic.openapi.v3.property) = {description: "任务ID"}];
}

message ListJobLogRequest {
  int64 currentPage = 1 [(gnostic.openapi.v3.property) = {description: "当前页码（从1开始）"}];
  int64 pageSize = 2 [(gnostic.openapi.v3.property) = {description: "每页条数（传0为全部）"}];
  string jobId = 3 [(gnostic.openapi.v3.property) = {description: "任务ID"}];
  string jobName = 4 [(gnostic.openapi.v3.property) = {description: "任务名称（支持模糊查询）"}];
  string status = 5 [(gnostic.openapi.v3.property) = {description: "执行结果：success=成功，fail=失败"}];
}

message ListJobLogResponse {
  repeated JobLog items = 1;
  int64 total = 2;
}

message GetJobLogRequest {
  // 日志ID
  string id = 1 [(gnostic.openapi.v3.property) = {description: "日志ID"}];
}

message DeleteJobLogRequest {
  repeated string ids = 1 [
    (buf.validate.field).repeated = {
      min_items: 1
      max_items: 100
    },
    (buf.validate.field).cel = {
      id: "joblog.ids.not_empty"
      message: "joblog.ids.not_empty"
      expression: "this.all(x, x.size() > 0)"
    },
    (gnostic.openapi.v3.property) = {description: "日志ID列表，至少一个"}
  ];
}
