syntax = "proto3";

package admin.service.v1;

import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "identity/service/v1/admin.proto";

service Identity {
  rpc ListAdmin(identity.service.v1.ListAdminRequest) returns (identity.service.v1.ListAdminResponse) {
    option (google.api.http) = {get: "/admin/v1/admin"};
    option (gnostic.openapi.v3.operation) = {
      tags: "Authentication"
      summary: "后台用户-列表"
      description: "后台用户列表"
    };
  }
  rpc CreateAdmin(identity.service.v1.CreateAdminRequest) returns (identity.service.v1.Admin) {
    option (google.api.http) = {
      post: "/admin/v1/admin"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      tags: "Authentication"
      summary: "后台用户-创建"
      description: "创建后台用户"
    };
  }
  rpc UpdateAdmin(identity.service.v1.UpdateAdminRequest) returns (identity.service.v1.Admin) {
    option (google.api.http) = {
      put: "/admin/v1/admin/{id}"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      tags: "Authentication"
      summary: "后台用户-修改"
      description: "修改后台用户"
    };
  }
  rpc GetAdmin(identity.service.v1.GetAdminRequest) returns (identity.service.v1.Admin) {
    option (google.api.http) = {get: "/admin/v1/admin/{id}"};
    option (gnostic.openapi.v3.operation) = {
      tags: "Authentication"
      summary: "后台用户-通过id获取"
      description: "通过id获取后台用户"
    };
  }
  rpc DeleteAdmin(identity.service.v1.DeleteAdminRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/admin/v1/admin"};
    option (gnostic.openapi.v3.operation) = {
      tags: "Authentication"
      summary: "后台用户-删除"
      description: "批量删除后台用户"
    };
  }
  rpc ResetPassword(identity.service.v1.ResetPasswordRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/admin/v1/admin/{id}/password"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      tags: "Authentication"
      summary: "后台用户-重置密码"
      description: "管理员重置指定用户的密码"
    };
  }
  rpc UpdateAdminStatus(identity.service.v1.UpdateAdminStatusRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/admin/v1/admin/{id}/status"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      tags: "Authentication"
      summary: "后台用户-修改状态"
      description: "启用或禁用后台用户"
    };
  }
  rpc BatchUpdateAdminStatus(identity.service.v1.BatchUpdateAdminStatusRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/admin/v1/admin/batch/status"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      tags: "Authentication"
      summary: "后台用户-批量修改状态"
      description: "批量启用或禁用后台用户"
    };
  }
  // 校验用户名是否存在（新建/编辑表单失焦校验）
  rpc UsernameExists(identity.service.v1.UsernameExistsRequest) returns (identity.service.v1.UsernameExistsResponse) {
    option (google.api.http) = {get: "/admin/v1/admin:username-exists"};
    option (gnostic.openapi.v3.operation) = {
      tags: "Authentication"
      summary: "后台用户-校验用户名是否存在"
      description: "校验用户名是否已被占用（编辑时通过 id 排除自身）"
    };
  }
}
