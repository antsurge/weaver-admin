syntax = "proto3";

package admin.service.v1;

import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "tenant/service/v1/tenant.proto";

service Tenant {
  // 列表
  rpc ListTenant(tenant.service.v1.ListTenantRequest) returns (tenant.service.v1.ListTenantResponse) {
    option (google.api.http) = {get: "/admin/v1/tenant"};
    option (gnostic.openapi.v3.operation) = {
      tags: "Tenant"
      summary: "租户-列表"
      description: "租户列表"
    };
  }
  // 详情
  rpc GetTenant(tenant.service.v1.GetTenantRequest) returns (tenant.service.v1.Tenant) {
    option (google.api.http) = {get: "/admin/v1/tenant/{id}"};
    option (gnostic.openapi.v3.operation) = {
      tags: "Tenant"
      summary: "租户-详情"
      description: "租户详情"
    };
  }
  // 创建
  rpc CreateTenant(tenant.service.v1.CreateTenantRequest) returns (tenant.service.v1.Tenant) {
    option (google.api.http) = {
      post: "/admin/v1/tenant"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      tags: "Tenant"
      summary: "租户-创建"
      description: "创建租户"
    };
  }
  // 更新
  rpc UpdateTenant(tenant.service.v1.UpdateTenantRequest) returns (tenant.service.v1.Tenant) {
    option (google.api.http) = {
      put: "/admin/v1/tenant/{id}"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      tags: "Tenant"
      summary: "租户-修改"
      description: "修改租户"
    };
  }
  // 更新状态
  rpc UpdateTenantStatus(tenant.service.v1.UpdateTenantStatusRequest) returns (tenant.service.v1.Tenant) {
    option (google.api.http) = {
      put: "/admin/v1/tenant/{id}/status"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      tags: "Tenant"
      summary: "租户-更新状态"
      description: "更新租户状态"
    };
  }
  // 删除（批量）
  rpc DeleteTenant(tenant.service.v1.DeleteTenantRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/admin/v1/tenant"};
    option (gnostic.openapi.v3.operation) = {
      tags: "Tenant"
      summary: "租户-删除(批量)"
      description: "删除租户(支持批量)"
    };
  }
}