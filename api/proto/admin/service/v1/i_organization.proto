syntax = "proto3";

package admin.service.v1;

import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "organization/service/v1/department.proto";
import "organization/service/v1/position.proto";

service Organization {
  // 列表的tree
  rpc DepartmentTree(organization.service.v1.DepartmentTreeRequest) returns (organization.service.v1.DepartmentTreeResponse) {
    option (google.api.http) = {get: "/admin/v1/department/tree"};
    option (gnostic.openapi.v3.operation) = {
      tags: "Organization"
      summary: "部门-Tree"
      description: "获取部门树"
    };
  }
  rpc GetDepartment(organization.service.v1.GetDepartmentRequest) returns (organization.service.v1.Department) {
    option (google.api.http) = {get: "/admin/v1/department/{id}"};
    option (gnostic.openapi.v3.operation) = {
      tags: "Organization"
      summary: "部门-通过id获取"
      description: "通过id获取部门"
    };
  }
  // 创建
  rpc CreateDepartment(organization.service.v1.CreateDepartmentRequest) returns (organization.service.v1.Department) {
    option (google.api.http) = {
      post: "/admin/v1/department"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      tags: "Organization"
      summary: "部门-创建"
      description: "创建部门"
    };
  }
  // 更新
  rpc UpdateDepartment(organization.service.v1.UpdateDepartmentRequest) returns (organization.service.v1.Department) {
    option (google.api.http) = {
      put: "/admin/v1/department/{id}"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      tags: "Organization"
      summary: "部门-更新"
      description: "更新部门"
    };
  }
  // 更新状态
  rpc UpdateDepartmentStatus(organization.service.v1.UpdateDepartmentStatusRequest) returns (organization.service.v1.Department) {
    option (google.api.http) = {
      put: "/admin/v1/department/{id}/status"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      tags: "Organization"
      summary: "部门-更新状态"
      description: "更新部门状态"
    };
  }
  // 批量删除
  rpc DeleteDepartment(organization.service.v1.DeleteDepartmentRequset) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/admin/v1/department"};
    option (gnostic.openapi.v3.operation) = {
      tags: "Organization"
      summary: "部门-删除(批量)"
      description: "删除部门(支持批量)"
    };
  }

  // 职务模块
  // 列表
  rpc ListPosition(organization.service.v1.ListPositionRequest) returns (organization.service.v1.ListPositionResponse) {
    option (google.api.http) = {get: "/admin/v1/position"};
    option (gnostic.openapi.v3.operation) = {
      tags: "Organization"
      summary: "职务-列表"
      description: "获取职务列表"
    };
  }
  rpc GetPosition(organization.service.v1.GetPositionRequest) returns (organization.service.v1.Position) {
    option (google.api.http) = {get: "/admin/v1/position/{id}"};
    option (gnostic.openapi.v3.operation) = {
      tags: "Organization"
      summary: "职务-详情"
      description: "职务详情"
    };
  }
  // 创建
  rpc CreatePosition(organization.service.v1.CreatePositionRequest) returns (organization.service.v1.Position) {
    option (google.api.http) = {
      post: "/admin/v1/position"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      tags: "Organization"
      summary: "职务-创建"
      description: "职务创建"
    };
  }
  // 更新
  rpc UpdatePosition(organization.service.v1.UpdatePositionRequest) returns (organization.service.v1.Position) {
    option (google.api.http) = {
      put: "/admin/v1/position/{id}"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      tags: "Organization"
      summary: "职务-修改"
      description: "职务修改"
    };
  }
  // 更新状态
  rpc UpdatePositionStatus(organization.service.v1.UpdatePositionStatusRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/admin/v1/position/{id}/status"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      tags: "Organization"
      summary: "职务-修改状态"
      description: "修改状态"
    };
  }
  // 删除
  rpc DeletePosition(organization.service.v1.DeletePositionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/admin/v1/position"};
    option (gnostic.openapi.v3.operation) = {
      tags: "Organization"
      summary: "职务-删除(批量)"
      description: "职务删除，支持批量删除"
    };
  }
  rpc IsPositionNameExists(organization.service.v1.IsPositionNameExistsRequest) returns (organization.service.v1.IsPositionFieldExistsResponse) {
    option (google.api.http) = {get: "/admin/v1/position:name-exists"};
    option (gnostic.openapi.v3.operation) = {
      tags: "Organization"
      summary: "职务-职务名称是否存在"
      description: "职务名称是否存在"
    };
  }
  rpc IsPositionCodeExists(organization.service.v1.IsPositionCodeExistsRequest) returns (organization.service.v1.IsPositionFieldExistsResponse) {
    option (google.api.http) = {get: "/admin/v1/position:code-exists"};
    option (gnostic.openapi.v3.operation) = {
      tags: "Organization"
      summary: "职务-职务名称是否存在"
      description: "职务编码是否存在"
    };
  }
}
