syntax = "proto3";

package admin.service.v1;

import "authentication/service/v1/authentication_service.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "gnostic/openapi/v3/annotations.proto";

// 用户后台登录认证服务
service AuthenticationService {
    // 获取验证码
    rpc GetCaptcha(google.protobuf.Empty) returns (authentication.service.v1.GetCaptchaResponse) {
        option (google.api.http) = {
            get: "admin/v1/get-captcha"
        };
        option (gnostic.openapi.v3.operation) = {
            tags: "Authentication"
            summary: "获取验证码"
            description: "获取验证码"
        };
    };

    // 登录
    rpc Login (authentication.service.v1.LoginRequest) returns (authentication.service.v1.LoginResponse) {
        option (google.api.http) = {
            post: "/admin/v1/login"
            body: "*"
        };
        option (gnostic.openapi.v3.operation) = {
            tags: "Authentication"
            summary: "用户登录"
            description: "用户登录"
        };
    }

    // 用户退出
    rpc Logout(authentication.service.v1.RefreshTokenRequest) returns (google.protobuf.Empty) {
        option (google.api.http) = {
            post:"/admin/v1/logout"
            body: "*"
        };
        option (gnostic.openapi.v3.operation) = {
            tags: "Authentication"
            summary: "用户登出"
            description: "用户登出"
        };
    };

    // 刷新认证令牌
    rpc RefreshToken(authentication.service.v1.RefreshTokenRequest) returns (authentication.service.v1.LoginResponse) {
        option (google.api.http) = {
            post:"/admin/v1/refresh-token"
            body: "*"
        };
        option (gnostic.openapi.v3.operation) = {
            tags: "Authentication"
            summary: "刷新认证令牌"
            description: "刷新认证令牌"
        };
    };
}