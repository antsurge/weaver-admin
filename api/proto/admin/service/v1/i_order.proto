syntax = "proto3";

package admin.service.v1;

import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "order/service/v1/order.proto";

// 订单服务（HTTP 路由聚合声明，与其他模块 i_*.proto 保持一致）
service OrderService {
  // 列表查询
  rpc ListOrder(order.service.v1.ListOrderRequest) returns (order.service.v1.ListOrderResponse) {
    option (google.api.http) = {get: "/admin/v1/orders"};
    option (gnostic.openapi.v3.operation) = {
      tags: "order"
      summary: "订单-列表"
      description: "订单分页列表"
    };
  }
  // 详情
  rpc GetOrder(order.service.v1.GetOrderRequest) returns (order.service.v1.GetOrderResponse) {
    option (google.api.http) = {get: "/admin/v1/orders/{id}"};
    option (gnostic.openapi.v3.operation) = {
      tags: "order"
      summary: "订单-详情"
      description: "根据ID获取订单详情"
    };
  }
  // 创建
  rpc CreateOrder(order.service.v1.CreateOrderRequest) returns (order.service.v1.CreateOrderResponse) {
    option (google.api.http) = {
      post: "/admin/v1/orders"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      tags: "order"
      summary: "订单-创建"
      description: "创建订单"
    };
  }
  // 更新
  rpc UpdateOrder(order.service.v1.UpdateOrderRequest) returns (order.service.v1.UpdateOrderResponse) {
    option (google.api.http) = {
      put: "/admin/v1/orders/{id}"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      tags: "order"
      summary: "订单-修改"
      description: "修改订单"
    };
  }
  // 删除（单条/批量）
  rpc DeleteOrder(order.service.v1.DeleteOrderRequest) returns (order.service.v1.DeleteOrderResponse) {
    option (google.api.http) = {delete: "/admin/v1/orders"};
    option (gnostic.openapi.v3.operation) = {
      tags: "order"
      summary: "订单-删除(批量)"
      description: "删除订单(支持批量)"
    };
  }
  // 状态切换
  rpc UpdateOrderStatus(order.service.v1.UpdateOrderStatusRequest) returns (order.service.v1.UpdateOrderStatusResponse) {
    option (google.api.http) = {
      put: "/admin/v1/orders/{id}/status"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      tags: "order"
      summary: "订单-更新状态"
      description: "更新订单状态"
    };
  }
}
