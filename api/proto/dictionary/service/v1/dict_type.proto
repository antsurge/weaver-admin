syntax = "proto3";

package dictionary.service.v1;

import "buf/validate/validate.proto";
import "dictionary/service/v1/dict_data.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/protobuf/timestamp.proto";

message DictType {
  // ID
  string id = 1 [(gnostic.openapi.v3.property) = {description: "ID"}];
  // 字典名称
  string name = 2 [(gnostic.openapi.v3.property) = {description: "字典名称"}];
  // 字典编码
  string code = 3 [(gnostic.openapi.v3.property) = {description: "字典唯一编码"}];
  // 状态
  string status = 4 [(gnostic.openapi.v3.property) = {description: "状态：enabled=启用，disabled=禁用"}];
  // 备注
  string remark = 5 [(gnostic.openapi.v3.property) = {description: "备注信息"}];
  // 创建时间
  google.protobuf.Timestamp createdAt = 6 [(gnostic.openapi.v3.property) = {description: "创建时间"}];
  // 更新时间
  google.protobuf.Timestamp updatedAt = 7 [(gnostic.openapi.v3.property) = {description: "更新时间"}];
  // 删除时间
  google.protobuf.Timestamp deletedAt = 8 [(gnostic.openapi.v3.property) = {description: "删除时间（软删除标记）"}];
  // 字典值
  repeated DictData dictData = 20 [(gnostic.openapi.v3.property) = {description: "字典数据列表"}];
}

message ListDictTypeRequest {
  int64 currentPage = 1 [(gnostic.openapi.v3.property) = {description: "当前页码（从1开始）"}];
  int64 pageSize = 2 [(gnostic.openapi.v3.property) = {description: "每页条数（传0为全部）"}];
  string name = 3 [(gnostic.openapi.v3.property) = {description: "名称（支持模糊查询）"}];
  string code = 4 [(gnostic.openapi.v3.property) = {description: "编码（支持模糊查询）"}];
  string status = 5 [(gnostic.openapi.v3.property) = {description: "状态（enabled=启用，disabled=禁用）"}];
}

message ListDictTypeResponse {
  repeated DictType items = 1;
  int64 total = 2;
}

message CreateDictTypeRequest {
  option (gnostic.openapi.v3.schema) = {
    required: [
      "name",
      "code",
      "status"
    ]
  };

  // 名称
  string name = 1 [
    (buf.validate.field).cel = {
      id: "dictType.name.required"
      message: "dictType.name.required"
      expression: "this.size() > 0"
    },
    (buf.validate.field).cel = {
      id: "dictType.name.max_len"
      message: "dictType.name.max_len"
      expression: "this.size() <= 64"
    },
    (gnostic.openapi.v3.property) = {description: "名称"}
  ];
  // 编码
  string code = 2 [
    (buf.validate.field).cel = {
      id: "dictType.code.required"
      message: "dictType.code.required"
      expression: "this.size() > 0"
    },
    (buf.validate.field).cel = {
      id: "dictType.code.max_len"
      message: "dictType.code.max_len"
      expression: "this.size() <= 64"
    },
    (gnostic.openapi.v3.property) = {description: "编码"}
  ];
  // 备注
  string remark = 3 [
    (buf.validate.field).cel = {
      id: "dictType.remark.max_len"
      message: "dictType.remark.max_len"
      expression: "this.size() <= 255"
    },
    (gnostic.openapi.v3.property) = {description: "备注"}
  ];
  // 状态
  string status = 4 [
    (buf.validate.field).string = {
      in: [
        "enabled",
        "disabled"
      ]
    },
    (buf.validate.field).cel = {
      id: "dictType.status.invalid"
      message: "dictType.status.invalid"
      expression: "this in ['enabled', 'disabled']"
    },
    (gnostic.openapi.v3.property) = {description: "状态（enabled/disabled）"}
  ];
}

message UpdateDictTypeRequest {
  option (gnostic.openapi.v3.schema) = {
    required: [
      "name",
      "code",
      "status"
    ]
  };

  // 名称
  string name = 1 [
    (buf.validate.field).cel = {
      id: "dictType.name.required"
      message: "dictType.name.required"
      expression: "this.size() > 0"
    },
    (buf.validate.field).cel = {
      id: "dictType.name.max_len"
      message: "dictType.name.max_len"
      expression: "this.size() <= 64"
    },
    (gnostic.openapi.v3.property) = {description: "名称"}
  ];
  // 编码
  string code = 2 [
    (buf.validate.field).cel = {
      id: "dictType.code.required"
      message: "dictType.code.required"
      expression: "this.size() > 0"
    },
    (buf.validate.field).cel = {
      id: "dictType.code.max_len"
      message: "dictType.code.max_len"
      expression: "this.size() <= 64"
    },
    (gnostic.openapi.v3.property) = {description: "编码"}
  ];
  // 备注
  string remark = 3 [
    (buf.validate.field).cel = {
      id: "dictType.remark.max_len"
      message: "dictType.remark.max_len"
      expression: "this.size() <= 255"
    },
    (gnostic.openapi.v3.property) = {description: "备注"}
  ];
  // 状态
  string status = 4 [
    (buf.validate.field).string = {
      in: [
        "enabled",
        "disabled"
      ]
    },
    (buf.validate.field).cel = {
      id: "dictType.status.invalid"
      message: "dictType.status.invalid"
      expression: "this in ['enabled', 'disabled']"
    },
    (gnostic.openapi.v3.property) = {description: "状态（enabled/disabled）"}
  ];
  string id = 10;
}

message UpdateDictTypeStatusRequest {
  option (gnostic.openapi.v3.schema) = {
    required: ["status"]
  };
  // ID
  string id = 1 [(gnostic.openapi.v3.property) = {description: "ID"}];
  // 职务状态
  string status = 2 [
    (buf.validate.field).string = {
      in: [
        "enabled",
        "disabled"
      ]
    },
    (buf.validate.field).cel = {
      id: "dictType.status.invalid"
      message: "dictType.status.invalid"
      expression: "this in ['enabled', 'disabled']"
    },
    (gnostic.openapi.v3.property) = {description: "状态（enabled/disabled）"}
  ];
}

message DeleteDictTypeRequset {
  repeated string ids = 1 [
    (buf.validate.field).repeated = {
      min_items: 1
      max_items: 100
    },
    (buf.validate.field).cel = {
      id: "dictType.ids.not_empty"
      message: "dictType.ids.not_empty"
      expression: "this.all(x, x.size() > 0)"
    },
    (gnostic.openapi.v3.property) = {description: "组织ID列表，至少一个"}
  ];
}
