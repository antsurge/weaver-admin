  option (gnostic.openapi.v3.schema) = {
    required: [
      "dictTypeID",
      "label",
      "value"
    ]
  };

  // 字典类型ID
  string dictTypeID = 1 [
    (buf.validate.field).cel = {
      id: "dictData.dictTypeID.required"
      message: "dictData.dictTypeID.required"
      expression: "this.size() > 0"
    },
    (buf.validate.field).cel = {
      id: "dictData.dictTypeID.max_len"
      message: "dictData.dictTypeID.max_len"
      expression: "this.size() <= 36"
    },
    (gnostic.openapi.v3.property) = {description: "所属字典类型ID"}
  ];
  // 标签
  string label = 2 [
    (buf.validate.field).cel = {
      id: "dictData.label.required"
      message: "dictData.label.required"
      expression: "this.size() > 0"
    },
    (buf.validate.field).cel = {
      id: "dictData.label.max_len"
      message: "dictData.label.max_len"
      expression: "this.size() <= 64"
    },
    (gnostic.openapi.v3.property) = {description: "显示标签（给前端展示）"}
  ];
  // 值
  string value = 3 [
    (buf.validate.field).cel = {
      id: "dictData.value.required"
      message: "dictData.value.required"
      expression: "this.size() > 0"
    },
    (buf.validate.field).cel = {
      id: "dictData.value.max_len"
      message: "dictData.value.max_len"
      expression: "this.size() <= 64"
    },
    (gnostic.openapi.v3.property) = {description: "字典值（实际存储值）"}
  ];
  // 排序
  int32 weight = 4 [(gnostic.openapi.v3.property) = {description: "排序权重，值越大越靠前"}];
  // 状态
  string status = 5 [
    (buf.validate.field).string = {
