    },
    (gnostic.openapi.v3.property) = {description: "状态（enabled=启用，disabled=禁用）"}
  ];
  // 扩展参数(JSON)
  string extension = 6 [
    (buf.validate.field).cel = {
      id: "dictData.extension.max_len"
      message: "dictData.extension.max_len"
      expression: "this.size() <= 1024"
    },
    (gnostic.openapi.v3.property) = {description: "扩展参数（JSON字符串，用于存储额外信息）"}
  ];
  // 备注
  string remark = 7 [
    (buf.validate.field).cel = {
      id: "dictData.remark.max_len"
      message: "dictData.remark.max_len"
      expression: "this.size() <= 255"
    },
    (gnostic.openapi.v3.property) = {description: "备注说明"}
  ];

  string id = 10;
}

message UpdateDictDataStatusRequest {
  option (gnostic.openapi.v3.schema) = {
    required: ["status"]
  };
  // ID
  string id = 1 [(gnostic.openapi.v3.property) = {description: "ID"}];
  // 岗位状态
  string status = 2 [
    (buf.validate.field).string = {
      in: [
        "enabled",
        "disabled"
      ]
    },
    (buf.validate.field).cel = {
      id: "dictData.status.invalid"
      message: "dictData.status.invalid"
      expression: "this in ['enabled', 'disabled']"
    },
    (gnostic.openapi.v3.property) = {description: "状态（enabled/disabled）"}
  ];
}

message DeleteDictDataRequset {
  repeated string ids = 1 [
    (buf.validate.field).repeated = {
      min_items: 1
      max_items: 100
    },
    (buf.validate.field).cel = {
      id: "dictData.ids.not_empty"
      message: "dictData.ids.not_empty"
      expression: "this.all(x, x.size() > 0)"
    },
    (gnostic.openapi.v3.property) = {description: "组织ID列表，至少一个"}
  ];
}
