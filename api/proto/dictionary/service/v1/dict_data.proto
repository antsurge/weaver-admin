syntax = "proto3";

package dictionary.service.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/protobuf/timestamp.proto";

message DictData {
  // 字典ID
  string id = 1 [(gnostic.openapi.v3.property) = {description: "ID"}];
  // 字典类型ID
  string dictTypeID = 2 [(gnostic.openapi.v3.property) = {description: "所属字典类型ID"}];
  // 标签
  string label = 3 [(gnostic.openapi.v3.property) = {description: "显示标签（给前端展示）"}];
  // 值
  string value = 4 [(gnostic.openapi.v3.property) = {description: "字典值（实际存储值）"}];
  // 排序
  int32 weight = 5 [(gnostic.openapi.v3.property) = {description: "排序权重，值越大越靠前"}];
  // 状态
  string status = 6 [(gnostic.openapi.v3.property) = {description: "状态：enabled=启用，disabled=禁用"}];
  // 扩展参数(JSON)
  string extension = 7 [(gnostic.openapi.v3.property) = {description: "扩展参数（JSON字符串，用于存储额外信息）"}];
  // 备注
  string remark = 8 [(gnostic.openapi.v3.property) = {description: "备注说明"}];
  // 创建时间
  google.protobuf.Timestamp createdAt = 9 [(gnostic.openapi.v3.property) = {description: "创建时间"}];
  // 更新时间
  google.protobuf.Timestamp updatedAt = 10 [(gnostic.openapi.v3.property) = {description: "更新时间"}];
  // 删除时间
  google.protobuf.Timestamp deletedAt = 11 [(gnostic.openapi.v3.property) = {description: "删除时间（为空表示未删除）"}];
}

message ListDictDataRequest {
  int64 currentPage = 1 [(gnostic.openapi.v3.property) = {description: "当前页码（从1开始）"}];
  int64 pageSize = 2 [(gnostic.openapi.v3.property) = {description: "每页条数（传0为全部）"}];
  string label = 3 [(gnostic.openapi.v3.property) = {description: "显示标签（支持模糊查询）"}];
  string value = 4 [(gnostic.openapi.v3.property) = {description: "值（支持模糊查询）"}];
  string status = 5 [(gnostic.openapi.v3.property) = {description: "状态（enabled=启用，disabled=禁用）"}];
}

message ListDictDataResponse {
  repeated DictData items = 1;
  int64 total = 2;
}

message CreateDictDataRequest {
  option (gnostic.openapi.v3.schema) = {
    required: [
      "dictTypeID",
      "label",
      "value"
    ]
  };

  // 字典类型ID
  string dictTypeID = 1 [
    (buf.validate.field).cel = {
      id: "dictData.dictTypeID.required"
      message: "dictData.dictTypeID.required"
      expression: "this.size() > 0"
    },
    (buf.validate.field).cel = {
      id: "dictData.dictTypeID.max_len"
      message: "dictData.dictTypeID.max_len"
      expression: "this.size() <= 36"
    },
    (gnostic.openapi.v3.property) = {description: "所属字典类型ID"}
  ];
  // 标签
  string label = 2 [
    (buf.validate.field).cel = {
      id: "dictData.label.required"
      message: "dictData.label.required"
      expression: "this.size() > 0"
    },
    (buf.validate.field).cel = {
      id: "dictData.label.max_len"
      message: "dictData.label.max_len"
      expression: "this.size() <= 64"
    },
    (gnostic.openapi.v3.property) = {description: "显示标签（给前端展示）"}
  ];
  // 值
  string value = 3 [
    (buf.validate.field).cel = {
      id: "dictData.value.required"
      message: "dictData.value.required"
      expression: "this.size() > 0"
    },
    (buf.validate.field).cel = {
      id: "dictData.value.max_len"
      message: "dictData.value.max_len"
      expression: "this.size() <= 64"
    },
    (gnostic.openapi.v3.property) = {description: "字典值（实际存储值）"}
  ];
  // 排序
  int32 weight = 4 [(gnostic.openapi.v3.property) = {description: "排序权重，值越大越靠前"}];
  // 状态
  string status = 5 [
    (buf.validate.field).string = {
      in: [
        "enabled",
        "disabled"
      ]
    },
    (buf.validate.field).cel = {
      id: "dictData.status.invalid"
      message: "dictData.status.invalid"
      expression: "this in ['enabled', 'disabled']"
    },
    (gnostic.openapi.v3.property) = {description: "状态（enabled=启用，disabled=禁用）"}
  ];
  // 扩展参数(JSON)
  string extension = 6 [
    (buf.validate.field).cel = {
      id: "dictData.extension.max_len"
      message: "dictData.extension.max_len"
      expression: "this.size() <= 1024"
    },
    (gnostic.openapi.v3.property) = {description: "扩展参数（JSON字符串，用于存储额外信息）"}
  ];
  // 备注
  string remark = 7 [
    (buf.validate.field).cel = {
      id: "dictData.remark.max_len"
      message: "dictData.remark.max_len"
      expression: "this.size() <= 255"
    },
    (gnostic.openapi.v3.property) = {description: "备注说明"}
  ];
}

