syntax = "proto3";

package authentication.service.v1;

import "google/protobuf/empty.proto";

// 用户登录认证服务
service AuthenticationService {
    // 用户登录
    rpc Login (LoginRequest) returns (LoginResponse) {}

    // 用户退出
    rpc Logout(google.protobuf.Empty) returns (google.protobuf.Empty);

    // 刷新认证令牌
    rpc RefreshToken (google.protobuf.Empty) returns (LoginResponse) {}

    rpc GetCaptcha(google.protobuf.Empty) returns (GetCaptchaResponse);
}

message LoginRequest {
    string username = 1; // 用户名
    string password = 2; // 密码
    string captcha = 3; // 验证码
    string captchaId = 4; // 验证码ID
}

message LoginResponse {
    string accessToken = 1;
    string refreshToken = 2;
    int64 accessTokenExpiresIn = 3;
    int64 refreshTokenExpiresIn = 4;
    string tokenType = 5;
    string userId = 6;
}

message GetCaptchaResponse {
    string captchaId = 1;
    string imageBase64 = 2; // data:image/png;base64,...
}