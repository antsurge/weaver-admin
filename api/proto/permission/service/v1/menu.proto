syntax = "proto3";

package permission.service.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/protobuf/timestamp.proto";

// 菜单
message Menu {
  string id = 1; // ID
  string parentID = 2; // 上级菜单
  string name = 3; // 名称
  string code = 4; // 编码
  string description = 5; // 描述
  string type = 6; // 类型
  string path = 7; // 路由路径
  string icon = 8; // 图标
  string linkUrl = 9; // 链接地址
  string component = 10; // 页面组件
  int32 weight = 11; // 权重
  string status = 12; // 状态
  string title = 13; // 标题
  string authCode = 14; // 权限标识
  string badgeType = 15; // 徽标类型
  string badge = 16; // 徽标内容
  string badgeVariants = 17; // 徽标样式
  string remark = 18; // 备注
  google.protobuf.Timestamp createdAt = 19; // 创建时间
  google.protobuf.Timestamp updatedAt = 20; // 更新时间

  repeated Menu children = 30;
}

// 创建菜单请求
message CreateMenuRequest {
  // 前端表单已不再提交 code、description（备注统一使用 remark）
  reserved 2, 3;
  reserved "code", "description";

  string name = 1 [
    (buf.validate.field).cel = {
      id: "CREATE_MENU_NAME_LENGTH"
      message: "菜单名称长度必须在 2-30 个字符之间"
      expression: "this.size() >= 2 && this.size() <= 30"
    },
    (gnostic.openapi.v3.property) = {description: "菜单名称"}
  ];

  string parentID = 4 [
    (buf.validate.field).cel = {
      id: "CREATE_MENU_PARENTID_MAX"
      expression: "this.size() <= 36"
    },
    (gnostic.openapi.v3.property) = {description: "上级菜单ID，空表示根节点"}
  ];

  string type = 5 [
    (buf.validate.field).cel = {
      id: "CREATE_MENU_TYPE_REQUIRED"
      message: "菜单类型不能为空"
      expression: "this.size() > 0"
    },
    (gnostic.openapi.v3.property) = {description: "类型: catalog / menu / iframe / link / action"}
  ];

  string path = 6 [
    (buf.validate.field).cel = {
      id: "CREATE_MENU_PATH_MAX"
      expression: "this.size() <= 100"
    },
    (gnostic.openapi.v3.property) = {description: "路由路径"}
  ];

  string icon = 7 [
    (buf.validate.field).cel = {
      id: "CREATE_MENU_ICON_MAX"
      expression: "this.size() <= 128"
    },
    (gnostic.openapi.v3.property) = {description: "图标"}
  ];

  string linkUrl = 8 [
    (buf.validate.field).cel = {
      id: "CREATE_MENU_LINK_URL_MAX"
      expression: "this.size() <= 100"
    },
    (gnostic.openapi.v3.property) = {description: "链接地址（iframe/外链）"}
  ];

  string component = 9 [
    (buf.validate.field).cel = {
      id: "CREATE_MENU_COMPONENT_MAX"
      expression: "this.size() <= 100"
    },
    (gnostic.openapi.v3.property) = {description: "页面组件路径"}
  ];

  int32 weight = 10 [
    (buf.validate.field).cel = {
      id: "CREATE_MENU_WEIGHT_MIN"
      expression: "this >= 0"
    },
    (gnostic.openapi.v3.property) = {description: "权重"}
  ];

  string status = 11 [(gnostic.openapi.v3.property) = {description: "状态: enabled / disabled"}];

  string title = 12 [
    (buf.validate.field).cel = {
      id: "CREATE_MENU_TITLE_LENGTH"
      message: "菜单标题长度必须在 2-30 个字符之间"
      expression: "this.size() >= 2 && this.size() <= 30"
    },
    (gnostic.openapi.v3.property) = {description: "标题（国际化 key）"}
  ];

  string authCode = 13 [
    (buf.validate.field).cel = {
      id: "CREATE_MENU_AUTH_CODE_MAX"
      expression: "this.size() <= 100"
    },
    (gnostic.openapi.v3.property) = {description: "权限标识"}
  ];

  string badgeType = 14 [(gnostic.openapi.v3.property) = {description: "徽标类型: dot / text"}];

  string badge = 15 [
    (buf.validate.field).cel = {
      id: "CREATE_MENU_BADGE_CONTENT_MAX"
      expression: "this.size() <= 10"
    },
    (gnostic.openapi.v3.property) = {description: "徽标内容"}
  ];

  string badgeVariants = 16 [(gnostic.openapi.v3.property) = {description: "徽标样式: default / destructive / primary / success / warning"}];

  string remark = 17 [(gnostic.openapi.v3.property) = {description: "备注"}];
}

// 创建权限响应
message CreateMenuResponse {
  Menu permission = 1;
}

// 更新菜单请求
message UpdateMenuRequest {
  // 前端表单已不再提交 code、description（备注统一使用 remark）
  reserved 3, 4;
  reserved "code", "description";

  string id = 1 [
    (buf.validate.field).cel = {
      id: "UPDATE_MENU_ID_REQUIRED"
      message: "菜单ID不能为空"
      expression: "this.size() > 0"
    },
    (gnostic.openapi.v3.property) = {description: "菜单ID"}
  ];

  optional string name = 2 [
    (buf.validate.field).cel = {
      id: "UPDATE_MENU_NAME_LENGTH"
      message: "菜单名称长度必须在 2-30 个字符之间"
      expression: "this.size() >= 2 && this.size() <= 30"
    },
    (gnostic.openapi.v3.property) = {description: "菜单名称"}
  ];

  optional string parentID = 5 [
    (buf.validate.field).cel = {
      id: "UPDATE_MENU_PARENTID_MAX"
      expression: "this.size() <= 36"
    },
    (gnostic.openapi.v3.property) = {description: "上级菜单ID，空表示根节点"}
  ];

  optional string type = 6 [(gnostic.openapi.v3.property) = {description: "类型: catalog / menu / iframe / link / action"}];

  optional string path = 7 [
    (buf.validate.field).cel = {
      id: "UPDATE_MENU_PATH_MAX"
      expression: "this.size() <= 100"
    },
    (gnostic.openapi.v3.property) = {description: "路由路径"}
  ];

  optional string icon = 8 [
    (buf.validate.field).cel = {
      id: "UPDATE_MENU_ICON_MAX"
      expression: "this.size() <= 128"
    },
    (gnostic.openapi.v3.property) = {description: "图标"}
  ];

  optional string linkUrl = 9 [
    (buf.validate.field).cel = {
      id: "UPDATE_MENU_LINK_URL_MAX"
      expression: "this.size() <= 100"
    },
    (gnostic.openapi.v3.property) = {description: "链接地址（iframe/外链）"}
  ];

  optional string component = 10 [
    (buf.validate.field).cel = {
      id: "UPDATE_MENU_COMPONENT_MAX"
      expression: "this.size() <= 100"
    },
    (gnostic.openapi.v3.property) = {description: "页面组件路径"}
  ];

  optional int32 weight = 11 [
    (buf.validate.field).cel = {
      id: "UPDATE_MENU_WEIGHT_MIN"
      expression: "this >= 0"
    },
    (gnostic.openapi.v3.property) = {description: "权重"}
  ];

  optional string status = 12 [(gnostic.openapi.v3.property) = {description: "状态: enabled / disabled"}];

  optional string title = 13 [
    (buf.validate.field).cel = {
      id: "UPDATE_MENU_TITLE_LENGTH"
      message: "菜单标题长度必须在 2-30 个字符之间"
      expression: "this.size() >= 2 && this.size() <= 30"
    },
    (gnostic.openapi.v3.property) = {description: "标题（国际化 key）"}
  ];

  optional string authCode = 14 [
    (buf.validate.field).cel = {
      id: "UPDATE_MENU_AUTH_CODE_MAX"
      expression: "this.size() <= 100"
    },
    (gnostic.openapi.v3.property) = {description: "权限标识"}
  ];

  optional string badgeType = 15 [(gnostic.openapi.v3.property) = {description: "徽标类型: dot / text"}];

  optional string badge = 16 [
    (buf.validate.field).cel = {
      id: "UPDATE_MENU_BADGE_CONTENT_MAX"
      expression: "this.size() <= 10"
    },
    (gnostic.openapi.v3.property) = {description: "徽标内容"}
  ];

  optional string badgeVariants = 17 [(gnostic.openapi.v3.property) = {description: "徽标样式: default / destructive / primary / success / warning"}];

  optional string remark = 18 [(gnostic.openapi.v3.property) = {description: "备注"}];
}

message UpdateMenuResponse {
  Menu permission = 1;
}

// 获取权限
message GetMenuRequest {
  string id = 1 [
    (buf.validate.field).cel = {
      id: "GET_PERMISSION_ID_REQUIRED"
      message: "权限ID不能为空"
      expression: "this.size() > 0"
    },
    (gnostic.openapi.v3.property) = {description: "权限ID"}
  ];
}

// 权限列表
message ListMenuRequest {
  int32 page = 1 [
    (buf.validate.field).cel = {
      id: "LIST_PERMISSION_PAGE_MIN"
      expression: "this >= 1"
    },
    (gnostic.openapi.v3.property) = {description: "页码"}
  ];
  int32 pageSize = 2 [
    (buf.validate.field).cel = {
      id: "LIST_PERMISSION_PAGE_SIZE"
      expression: "this >= 1 && this <= 100"
    },
    (gnostic.openapi.v3.property) = {description: "每页数量"}
  ];
  string keyword = 3 [(gnostic.openapi.v3.property) = {description: "搜索关键词"}];
  string parentID = 4 [(gnostic.openapi.v3.property) = {description: "父权限ID，空查根"}];
  string type = 5 [(gnostic.openapi.v3.property) = {description: "按类型筛选"}];
}

message ListMenuResponse {
  repeated Menu items = 1;
  int32 total = 2;
}

// 树形权限列表（用于菜单）
message MenuTreeRequest {
  string type = 1 [(gnostic.openapi.v3.property) = {description: "通常传 MENU"}];
  string name = 2 [(gnostic.openapi.v3.property) = {description: "菜单名称（模糊查询）"}];
  string code = 3 [(gnostic.openapi.v3.property) = {description: "菜单编码（模糊查询）"}];
  string status = 4 [(gnostic.openapi.v3.property) = {description: "菜单状态"}];
}

// 树形权限列表响应
message MenuTreeResponse {
  repeated Menu items = 1;
}

// 删除权限
message DeleteMenuRequest {
  repeated string ids = 1 [
    (buf.validate.field).repeated = {min_items: 1},
    (gnostic.openapi.v3.property) = {description: "权限ID列表，至少一个"}
  ];
}

message UpdateMenuStatusRequest {
  string id = 1 [
    (buf.validate.field).cel = {
      id: "GET_PERMISSION_ID_REQUIRED"
      message: "权限ID不能为空"
      expression: "this.size() > 0"
    },
    (gnostic.openapi.v3.property) = {description: "权限ID"}
  ];
  string status = 2 [(gnostic.openapi.v3.property) = {description: "状态: enabled / disabled"}];
}
