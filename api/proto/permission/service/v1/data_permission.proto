syntax = "proto3";

package permission.service.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/protobuf/timestamp.proto";

// 数据权限规则
message DataPermission {
  // ID
  string id = 1 [(gnostic.openapi.v3.property) = {description: "ID"}];
  // 规则名称
  string name = 2 [(gnostic.openapi.v3.property) = {description: "规则名称"}];
  // 规则编码
  string code = 3 [(gnostic.openapi.v3.property) = {description: "规则唯一编码"}];
  // 数据范围
  string scopeType = 4 [(gnostic.openapi.v3.property) = {description: "数据范围：1=全部数据 2=自定义 3=本部门 4=本部门及以下 5=仅本人"}];
  // 自定义部门集合
  string deptIds = 5 [(gnostic.openapi.v3.property) = {description: "自定义数据范围的部门ID集合（JSON数组）"}];
  // 自定义角色集合
  string roleIds = 6 [(gnostic.openapi.v3.property) = {description: "自定义数据范围的角色ID集合（JSON数组）"}];
  // 状态
  string status = 7 [(gnostic.openapi.v3.property) = {description: "状态：enabled=启用，disabled=禁用"}];
  // 备注
  string remark = 8 [(gnostic.openapi.v3.property) = {description: "备注信息"}];
  // 创建时间
  google.protobuf.Timestamp createdAt = 9 [(gnostic.openapi.v3.property) = {description: "创建时间"}];
  // 更新时间
  google.protobuf.Timestamp updatedAt = 10 [(gnostic.openapi.v3.property) = {description: "更新时间"}];
  // 删除时间
  google.protobuf.Timestamp deletedAt = 11 [(gnostic.openapi.v3.property) = {description: "删除时间（软删除标记）"}];
}

message ListDataPermissionRequest {
  int64 currentPage = 1 [(gnostic.openapi.v3.property) = {description: "当前页码（从1开始）"}];
  int64 pageSize = 2 [(gnostic.openapi.v3.property) = {description: "每页条数（传0为全部）"}];
  string name = 3 [(gnostic.openapi.v3.property) = {description: "规则名称（支持模糊查询）"}];
  string code = 4 [(gnostic.openapi.v3.property) = {description: "规则编码（支持模糊查询）"}];
  string scopeType = 5 [(gnostic.openapi.v3.property) = {description: "数据范围"}];
  string status = 6 [(gnostic.openapi.v3.property) = {description: "状态（enabled=启用，disabled=禁用）"}];
}

message ListDataPermissionResponse {
  repeated DataPermission items = 1;
  int64 total = 2;
}

message CreateDataPermissionRequest {
  option (gnostic.openapi.v3.schema) = {
    required: [
      "name",
      "code",
      "scopeType",
      "status"
    ]
  };

  // 规则名称
  string name = 1 [
    (buf.validate.field).cel = {
      id: "dataPermission.name.required"
      message: "dataPermission.name.required"
      expression: "this.size() > 0"
    },
    (buf.validate.field).cel = {
      id: "dataPermission.name.max_len"
      message: "dataPermission.name.max_len"
      expression: "this.size() <= 64"
    },
    (gnostic.openapi.v3.property) = {description: "规则名称"}
  ];
  // 规则编码
  string code = 2 [
    (buf.validate.field).cel = {
      id: "dataPermission.code.required"
      message: "dataPermission.code.required"
      expression: "this.size() > 0"
    },
    (buf.validate.field).cel = {
      id: "dataPermission.code.max_len"
      message: "dataPermission.code.max_len"
      expression: "this.size() <= 100"
    },
    (gnostic.openapi.v3.property) = {description: "规则编码（唯一）"}
  ];
  // 数据范围
  string scopeType = 3 [
    (buf.validate.field).string = {
      in: [
        "1",
        "2",
        "3",
        "4",
        "5"
      ]
    },
    (buf.validate.field).cel = {
      id: "dataPermission.scopeType.invalid"
      message: "dataPermission.scopeType.invalid"
      expression: "this in ['1', '2', '3', '4', '5']"
    },
    (gnostic.openapi.v3.property) = {description: "数据范围（1=全部数据 2=自定义 3=本部门 4=本部门及以下 5=仅本人）"}
  ];
  // 自定义部门集合
  string deptIds = 4 [
    (buf.validate.field).cel = {
      id: "dataPermission.deptIds.max_len"
      message: "dataPermission.deptIds.max_len"
      expression: "this.size() <= 1000"
    },
    (gnostic.openapi.v3.property) = {description: "自定义数据范围的部门ID集合（JSON数组）"}
  ];
  // 自定义角色集合
  string roleIds = 5 [
    (buf.validate.field).cel = {
      id: "dataPermission.roleIds.max_len"
      message: "dataPermission.roleIds.max_len"
      expression: "this.size() <= 1000"
    },
    (gnostic.openapi.v3.property) = {description: "自定义数据范围的角色ID集合（JSON数组）"}
  ];
  // 状态
  string status = 6 [
    (buf.validate.field).string = {
      in: [
        "enabled",
        "disabled"
      ]
    },
    (buf.validate.field).cel = {
      id: "dataPermission.status.invalid"
      message: "dataPermission.status.invalid"
      expression: "this in ['enabled', 'disabled']"
    },
    (gnostic.openapi.v3.property) = {description: "状态（enabled/disabled）"}
  ];
  // 备注
  string remark = 7 [
    (buf.validate.field).cel = {
      id: "dataPermission.remark.max_len"
      message: "dataPermission.remark.max_len"
      expression: "this.size() <= 255"
    },
    (gnostic.openapi.v3.property) = {description: "备注"}
  ];
}

