    (gnostic.openapi.v3.property) = {description: "备注"}
  ];
  string id = 10;
}

message UpdateDataPermissionStatusRequest {
  option (gnostic.openapi.v3.schema) = {
    required: ["status"]
  };
  // ID
  string id = 1 [(gnostic.openapi.v3.property) = {description: "ID"}];
  // 状态
  string status = 2 [
    (buf.validate.field).string = {
      in: [
        "enabled",
        "disabled"
      ]
    },
    (buf.validate.field).cel = {
      id: "dataPermission.status.invalid"
      message: "dataPermission.status.invalid"
      expression: "this in ['enabled', 'disabled']"
    },
    (gnostic.openapi.v3.property) = {description: "状态（enabled/disabled）"}
  ];
}

message DeleteDataPermissionRequest {
  repeated string ids = 1 [
    (buf.validate.field).repeated = {
      min_items: 1
      max_items: 100
    },
    (buf.validate.field).cel = {
      id: "dataPermission.ids.not_empty"
      message: "dataPermission.ids.not_empty"
      expression: "this.all(x, x.size() > 0)"
    },
    (gnostic.openapi.v3.property) = {description: "规则ID列表，至少一个"}
  ];
}

// ====== 唯一性校验 ======

// 数据权限规则编码是否存在请求
message IsDataPermissionCodeExistsRequest {
  string code = 1 [(gnostic.openapi.v3.property) = {description: "规则编码"}];
  string id = 2 [(gnostic.openapi.v3.property) = {description: "规则ID（编辑时排除自身）"}];
}

// 数据权限规则编码是否存在响应
message IsDataPermissionFieldExistsResponse {
  bool exists = 1 [(gnostic.openapi.v3.property) = {description: "是否存在"}];
}
