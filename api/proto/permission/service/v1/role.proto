syntax = "proto3";

package permission.service.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/protobuf/timestamp.proto";

message Role {
  option (gnostic.openapi.v3.schema) = {description: "角色信息"};
  string id = 1 [(gnostic.openapi.v3.property) = {description: "角色ID"}];
  string name = 2 [(gnostic.openapi.v3.property) = {description: "角色名称"}];
  string code = 3 [(gnostic.openapi.v3.property) = {description: "角色编码"}];
  string remark = 4 [(gnostic.openapi.v3.property) = {description: "备注说明"}];
  int32 weight = 5 [(gnostic.openapi.v3.property) = {description: "权重（排序用）"}];
  string status = 6 [(gnostic.openapi.v3.property) = {description: "状态（enabled/disabled）"}];
  // 数据权限范围
  string dataScope = 7 [(gnostic.openapi.v3.property) = {description: "数据权限范围（如：ALL、DEPT、SELF）"}];
  // 是否系统内置
  bool isSystem = 8 [(gnostic.openapi.v3.property) = {description: "是否系统内置角色"}];
  google.protobuf.Timestamp createdAt = 10 [(gnostic.openapi.v3.property) = {description: "创建时间"}];
  google.protobuf.Timestamp updatedAt = 11 [(gnostic.openapi.v3.property) = {description: "更新时间"}];
}

message ListRoleRequest {
  int64 currentPage = 1 [(gnostic.openapi.v3.property) = {description: "当前页码（从1开始）"}];
  int64 pageSize = 2 [(gnostic.openapi.v3.property) = {description: "每页条数（传0为全部）"}];
  string name = 3 [(gnostic.openapi.v3.property) = {description: "角色名称（支持模糊查询）"}];
  string code = 4 [(gnostic.openapi.v3.property) = {description: "角色编码（支持模糊查询）"}];
  string status = 5 [(gnostic.openapi.v3.property) = {description: "状态（enabled=启用，disabled=禁用）"}];
}

message ListRoleResponse {
  repeated Role items = 1 [(gnostic.openapi.v3.property) = {description: "列表"}];
  int64 total = 2 [(gnostic.openapi.v3.property) = {description: "总数"}];
}

message GetRoleRequest {
  string id = 1 [(gnostic.openapi.v3.property) = {description: "ID"}];
}

message CreateRoleRequest {
  option (gnostic.openapi.v3.schema) = {
    required: [
      "name",
      "code",
      "status"
    ]
  };
  string name = 2 [(gnostic.openapi.v3.property) = {description: "角色名称"}];
  string code = 3 [(gnostic.openapi.v3.property) = {description: "角色编码"}];
  string remark = 4 [(gnostic.openapi.v3.property) = {description: "备注说明"}];
  int32 weight = 5 [(gnostic.openapi.v3.property) = {description: "权重（排序用）"}];
  string status = 6 [(gnostic.openapi.v3.property) = {description: "状态（enabled/disabled）"}];
  // 数据权限范围
  string dataScope = 7 [(gnostic.openapi.v3.property) = {description: "数据权限范围（如：ALL、DEPT、SELF）"}];
  // 是否系统内置
  bool isSystem = 8 [(gnostic.openapi.v3.property) = {description: "是否系统内置角色"}];
}

message UpdateRoleRequest {
  string id = 1 [(gnostic.openapi.v3.property) = {description: "ID"}];
  option (gnostic.openapi.v3.schema) = {
    required: [
      "name",
      "code",
      "status"
    ]
  };
  string name = 2 [(gnostic.openapi.v3.property) = {description: "角色名称"}];
  string code = 3 [(gnostic.openapi.v3.property) = {description: "角色编码"}];
  string remark = 4 [(gnostic.openapi.v3.property) = {description: "备注说明"}];
  int32 weight = 5 [(gnostic.openapi.v3.property) = {description: "权重（排序用）"}];
  string status = 6 [(gnostic.openapi.v3.property) = {description: "状态（enabled/disabled）"}];
  // 数据权限范围
  string dataScope = 7 [(gnostic.openapi.v3.property) = {description: "数据权限范围（如：ALL、DEPT、SELF）"}];
  // 是否系统内置
  bool isSystem = 8 [(gnostic.openapi.v3.property) = {description: "是否系统内置角色"}];
}

message UpdateRoleStatusRequest {
  option (gnostic.openapi.v3.schema) = {
    required: ["status"]
  };
  // ID
  string id = 1 [(gnostic.openapi.v3.property) = {description: "ID"}];
  // 职务状态
  string status = 2 [
    (buf.validate.field).string = {
      in: [
        "enabled",
        "disabled"
      ]
    },
    (buf.validate.field).cel = {
      id: "role.status.invalid"
      message: "role.status.invalid"
      expression: "this in ['enabled', 'disabled']"
    },
    (gnostic.openapi.v3.property) = {description: "状态（enabled/disabled）"}
  ];
}

message DeleteRoleRequest {
  repeated string ids = 1 [
    (buf.validate.field).repeated = {
      min_items: 1
      max_items: 100
    },
    (buf.validate.field).cel = {
      id: "role.ids.not_empty"
      message: "role.ids.not_empty"
      expression: "this.all(x, x.size() > 0)"
    },
    (gnostic.openapi.v3.property) = {description: "ID列表（必填，至少1个，最多100个，每个ID不能为空）"}
  ];
}
