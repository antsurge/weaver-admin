syntax = "proto3";

package message.service.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";

// Notification 通知正文（一条通知的元数据与投放范围）
message Notification {
  // ID
  string id = 1 [(gnostic.openapi.v3.property) = {description: "通知ID"}];
  // 标题
  string title = 2 [(gnostic.openapi.v3.property) = {description: "通知标题"}];
  // 内容
  string content = 3 [(gnostic.openapi.v3.property) = {description: "通知内容"}];
  // 类型：system=系统 announce=公告 audit=审批 todo=待办 alert=告警
  string type = 4 [(gnostic.openapi.v3.property) = {description: "通知类型"}];
  // 级别：info=普通 success=成功 warn=警告 error=严重
  string level = 5 [(gnostic.openapi.v3.property) = {description: "重要级别"}];
  // 业务类型
  string bizType = 6 [(gnostic.openapi.v3.property) = {description: "业务类型"}];
  // 业务ID
  string bizId = 7 [(gnostic.openapi.v3.property) = {description: "业务ID"}];
  // 发送人ID
  string senderId = 8 [(gnostic.openapi.v3.property) = {description: "发送人ID"}];
  // 发送人名称
  string senderName = 9 [(gnostic.openapi.v3.property) = {description: "发送人名称"}];
  // 跳转路由
  string link = 10 [(gnostic.openapi.v3.property) = {description: "点击跳转的前端路由"}];
  // 投放范围：all=全体 user=指定用户 role=指定角色
  string targetType = 11 [(gnostic.openapi.v3.property) = {description: "投放范围"}];
  // 投放目标ID
  repeated string targetIds = 12 [(gnostic.openapi.v3.property) = {description: "投放目标ID集合"}];
  // 状态：draft=草稿 published=已发布 revoked=已撤回
  string status = 13 [(gnostic.openapi.v3.property) = {description: "状态"}];
  // 发布时间（RFC3339）
  string publishedAt = 14 [(gnostic.openapi.v3.property) = {description: "发布时间"}];
  // 过期时间（RFC3339）
  string expireAt = 15 [(gnostic.openapi.v3.property) = {description: "过期时间"}];
  // 创建时间（RFC3339）
  string createdAt = 16 [(gnostic.openapi.v3.property) = {description: "创建时间"}];
  // 更新时间（RFC3339）
  string updatedAt = 17 [(gnostic.openapi.v3.property) = {description: "更新时间"}];
}

// NotificationRecord 用户收件箱条目
message NotificationRecord {
  // 收件记录ID
  string id = 1 [(gnostic.openapi.v3.property) = {description: "收件记录ID"}];
  // 通知ID
  string notificationId = 2 [(gnostic.openapi.v3.property) = {description: "通知ID"}];
  // 接收人ID
  string userId = 3 [(gnostic.openapi.v3.property) = {description: "接收人ID"}];
  // 是否已读
  bool isRead = 4 [(gnostic.openapi.v3.property) = {description: "是否已读"}];
  // 已读时间（RFC3339）
  string readAt = 5 [(gnostic.openapi.v3.property) = {description: "已读时间"}];
  // 是否已删除
  bool isDeleted = 6 [(gnostic.openapi.v3.property) = {description: "是否已删除"}];
  // 创建时间（RFC3339）
  string createdAt = 7 [(gnostic.openapi.v3.property) = {description: "创建时间"}];
  // 更新时间（RFC3339）
  string updatedAt = 8 [(gnostic.openapi.v3.property) = {description: "更新时间"}];
  // 通知正文（列表接口联带返回）
  Notification notification = 9 [(gnostic.openapi.v3.property) = {description: "通知正文"}];
}

// ───────────── 我的消息 ─────────────

message ListNotificationRequest {
  int64 currentPage = 1 [(gnostic.openapi.v3.property) = {description: "当前页码（从1开始）"}];
  int64 pageSize = 2 [(gnostic.openapi.v3.property) = {description: "每页条数（传0为全部）"}];
  // 是否已读过滤，不传表示不过滤
  optional bool isRead = 3 [(gnostic.openapi.v3.property) = {description: "是否已读（不传=全部）"}];
  // 类型过滤
  string type = 4 [(gnostic.openapi.v3.property) = {description: "通知类型过滤"}];
  // 级别过滤
  string level = 5 [(gnostic.openapi.v3.property) = {description: "级别过滤"}];
  // 关键字（标题/内容模糊匹配）
  string keyword = 6 [(gnostic.openapi.v3.property) = {description: "关键字（标题/内容模糊匹配）"}];
}

message ListNotificationResponse {
  repeated NotificationRecord items = 1;
  int64 total = 2;
}

message GetUnreadCountResponse {
  int64 count = 1 [(gnostic.openapi.v3.property) = {description: "未读数量"}];
}

message ReadNotificationRequest {
  // 收件记录ID
  string id = 1 [(gnostic.openapi.v3.property) = {description: "收件记录ID"}];
}

message ReadAllNotificationRequest {
  // 预留扩展字段：当前无入参，body 接收空对象 {}
}

message DeleteNotificationRequest {
  repeated string ids = 1 [
    (buf.validate.field).repeated = {
      min_items: 1
      max_items: 100
    },
    (buf.validate.field).cel = {
      id: "notification.ids.not_empty"
      message: "notification.ids.not_empty"
      expression: "this.all(x, x.size() > 0)"
    },
    (gnostic.openapi.v3.property) = {description: "收件记录ID列表，至少一个"}
  ];
}

// ───────────── 管理端：发布与管理 ─────────────

message CreateNotificationRequest {
  option (gnostic.openapi.v3.schema) = {
    required: [
      "title",
      "content"
    ]
  };

  // 标题
  string title = 1 [
    (buf.validate.field).cel = {
      id: "notification.title.required"
      message: "notification.title.required"
      expression: "this.size() > 0"
    },
    (buf.validate.field).cel = {
      id: "notification.title.max_len"
      message: "notification.title.max_len"
      expression: "this.size() <= 128"
    },
    (gnostic.openapi.v3.property) = {description: "通知标题"}
  ];
  // 内容
  string content = 2 [
    (buf.validate.field).cel = {
      id: "notification.content.max_len"
      message: "notification.content.max_len"
      expression: "this.size() <= 1024"
    },
    (gnostic.openapi.v3.property) = {description: "通知内容"}
  ];
  // 类型
  string type = 3 [
    (buf.validate.field).cel = {
      id: "notification.type.invalid"
      message: "notification.type.invalid"
      expression: "this == '' || this in ['system', 'announce', 'audit', 'todo', 'alert']"
    },
    (gnostic.openapi.v3.property) = {description: "通知类型（默认 system）"}
  ];
  // 级别
  string level = 4 [
    (buf.validate.field).cel = {
      id: "notification.level.invalid"
      message: "notification.level.invalid"
      expression: "this == '' || this in ['info', 'success', 'warn', 'error']"
    },
    (gnostic.openapi.v3.property) = {description: "重要级别（默认 info）"}
  ];
  // 业务类型
  string bizType = 5 [(gnostic.openapi.v3.property) = {description: "业务类型"}];
  // 业务ID
  string bizId = 6 [(gnostic.openapi.v3.property) = {description: "业务ID"}];
  // 跳转路由
  string link = 7 [(gnostic.openapi.v3.property) = {description: "点击跳转的前端路由"}];
  // 投放范围：all=全体 user=指定用户 role=指定角色（默认 all）
  string targetType = 8 [
    (buf.validate.field).cel = {
      id: "notification.target_type.invalid"
      message: "notification.target_type.invalid"
      expression: "this == '' || this in ['all', 'user', 'role']"
    },
    (gnostic.openapi.v3.property) = {description: "投放范围（默认 all）"}
  ];
  // 投放目标ID集合
  repeated string targetIds = 9 [(gnostic.openapi.v3.property) = {description: "投放目标ID集合"}];
}

message RevokeNotificationRequest {
  // 通知ID
  string id = 1 [(gnostic.openapi.v3.property) = {description: "通知ID"}];
}

message ListNotificationManageRequest {
  int64 currentPage = 1 [(gnostic.openapi.v3.property) = {description: "当前页码（从1开始）"}];
  int64 pageSize = 2 [(gnostic.openapi.v3.property) = {description: "每页条数（传0为全部）"}];
  // 标题（模糊）
  string title = 3 [(gnostic.openapi.v3.property) = {description: "标题（模糊查询）"}];
  // 类型
  string type = 4 [(gnostic.openapi.v3.property) = {description: "类型过滤"}];
  // 级别
  string level = 5 [(gnostic.openapi.v3.property) = {description: "级别过滤"}];
  // 状态
  string status = 6 [(gnostic.openapi.v3.property) = {description: "状态过滤"}];
}

message ListNotificationManageResponse {
  repeated Notification items = 1;
  int64 total = 2;
}
