syntax = "proto3";
package kratos.api;

option go_package = "github.com/antsurge/weaver-admin/app/admin/service/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  JWT jwt = 3;
  MQ mq = 4;
  App app = 5;
}

message App {
  bool is_demo = 1; // 演示环境
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Database {
    string driver = 1;
    string source = 2;
  }
  message Redis {
    string network = 1;
    string addr = 2;
    string password = 3;
    google.protobuf.Duration read_timeout = 4;
    google.protobuf.Duration write_timeout = 5;
    string key_prefix = 6;
  }
  Database database = 1;
  Redis redis = 2;
}

/**
 * JWT 配置
 */
message JWT {
  // 签名密钥（HS256）
  string access_secret = 1;

  string refresh_secret = 2;

  // token 签发方（iss）
  string issuer = 3;

  // access token 有效期
  google.protobuf.Duration access_ttl = 4;

  // refresh token 有效期
  google.protobuf.Duration refresh_ttl = 5;
}

/**
MQ配置
 */
message MQ {
  string driver = 1;

  RabbitMQ rabbitmq = 2;
}

// Rabbitmq 配置
message RabbitMQ {
  string url = 1;

  // 默认 exchange（可以为空）
  string exchange = 2;

  string queue = 3;

  string routing_key = 4;

  int32 prefetch = 5;

  int32 pool_size = 6;

  bool durable = 7;
}