syntax = "proto3";
package kratos.api;

option go_package = "github.com/hypercoze/kratos-admin/app/admin/service/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  JWT jwt = 3;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Database {
    string driver = 1;
    string source = 2;
  }
  message Redis {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration read_timeout = 3;
    google.protobuf.Duration write_timeout = 4;
  }
  Database database = 1;
  Redis redis = 2;
}

/**
 * JWT 配置
 */
message JWT {
  // 签名密钥（HS256）
  string secret = 1;

  // token 签发方（iss）
  string issuer = 2;

  // access token 有效期
  google.protobuf.Duration access_ttl = 3;

  // refresh token 有效期
  google.protobuf.Duration refresh_ttl = 4;
}
